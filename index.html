<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doc2Proto</title>
<style>
:root{
  --bg:#e9ebef; --card:#ffffff; --ink:#1b1d22; --muted:#8a909c; --line:#dde0e6;
  --brand:#4a55e0; --shadow:0 2px 14px rgba(20,24,40,.10);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121317; --card:#1b1d23; --ink:#eceef2; --muted:#7d8391; --line:#2c2f38;
    --brand:#7b84ff; --shadow:0 2px 18px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:var(--bg);color:var(--ink);font:15px/1.6 'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:32px 28px;text-align:center;max-width:420px;width:100%}
h1{margin:0 0 20px;font-size:22px}
.btn{display:inline-block;padding:12px 22px;border-radius:8px;background:var(--brand);color:#fff;
  font-weight:700;text-decoration:none}
.btn:hover{opacity:.9}
</style>
</head>
<body>
<main class="card">
  <h1>Doc2Proto</h1>
  <a class="btn" href="sample.html" target="_blank" rel="noopener">샘플 기획서 열기 ↗</a>
</main>
</body>
</html>
