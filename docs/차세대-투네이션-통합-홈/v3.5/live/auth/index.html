  post({ type: 'spec', refs: refsOf(el), label: (el.title || el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 30) });
}, true);
F.addEventListener('mouseover', (e) => {
  if (!F.classList.contains('inspect')) return;
  const el = e.target.closest('[data-spec]');
  if (!el) { chip.style.display = 'none'; return; }
  const r = el.getBoundingClientRect(), fr = F.getBoundingClientRect();
  chip.textContent = refsOf(el).map((x) => x.replace(':', 'p ')).join(' · ');
  chip.style.display = 'block'; chip.style.left = Math.max(0, Math.min(r.left - fr.left, fr.width - chip.offsetWidth)) + 'px'; chip.style.top = Math.max(0, r.top - fr.top - 14) + 'px';
});
const HINT = { '51:5': (s) => { s.S.tf.tip = true; s.render(); } };
addEventListener('message', (e) => {
  const m = e.data; if (!m || !m.d2p) return;
  if (m.type === 'focus') {
    const find = () => [...F.querySelectorAll('[data-spec]')].filter((x) => refsOf(x).includes(m.ref) && x.offsetParent !== null);
    let els = find();
    if ((!els.length || HINT[m.ref]) && HINT[m.ref]) { SCR.forEach((s) => { if (s.S.view.startsWith('tf')) HINT[m.ref](s); }); els = find(); }
    els.slice(0, 6).forEach((x) => { x.classList.remove('spec-flash'); void x.offsetWidth; x.classList.add('spec-flash'); setTimeout(() => x.classList.remove('spec-flash'), 3200); });
    post({ type: 'focused', ref: m.ref, count: els.length });
  } else if (m.type === 'inspect') F.classList.toggle('inspect', !!m.on);
  else if (m.type === 'event') runEvent(m.name, m.value);
  else if (m.type === 'changed') {
    F.querySelectorAll('[data-chg]').forEach((x) => x.removeAttribute('data-chg'));
    const set = new Set(m.refs || []);
    F.querySelectorAll('[data-spec]').forEach((x) => { if (refsOf(x).some((r) => set.has(r))) x.setAttribute('data-chg', '변경'); });
  }
});
// 이벤트 버튼: 해당 동작을 할 수 있는 화면을 골라 실행 (없으면 첫 화면을 그 상태로 바꿈)
const pick = (views) => SCR.find((s) => views.includes(s.S.view)) || SCR[0];
function runEvent(name, value) {
  switch (name) {
    case 'terms': { const s = pick(['terms']); if (s.S.view !== 'terms') s.preset('terms'); if (value === 'all') { s.S.terms = [1, 1, 1, 1]; s.render(); s.toast('전체 동의 — 일괄 체크, 다음 버튼 활성화'); } else s.act('tdoc', { dataset: { i: '1' } }); break; }
    case 'flow': { const s = SCR[0]; s.preset('authsel'); s.S.sel = value; s.render(); setTimeout(() => s.act('anext', { dataset: {} }), 400); break; }
    case 'ovs': {
      const s = pick(['ovsc', 'ovsp']);
      if (value === 'daily') { if (s.S.view !== 'ovsp') s.preset('ovs-phone'); Object.assign(s.S.ovs, { cc: '+975', ph: '1012121111', sends: 10 }); s.render(); s.act('pnext', { dataset: {} }); break; }
      if (s.S.view !== 'ovsc') s.preset('ovs-code');
      if (value === 'wrong') { s.S.oc.v = '111111'; s.act('cnext', { dataset: {} }); }
      if (value === 'timeout') { s.S.oc.left = 3; s.render(); s.toast('입력 제한시간 10분 — 3초 남김 (프로토타입)'); }
      if (value === 'resend') { s.S.oc.resend = 10; s.act('oresend', { dataset: {} }); }
      if (value === 'fail') { s.S.oc.retry = 0; s.S.oc.v = '111111'; s.act('cnext', { dataset: {} }); }
      break;
    }
    case 'newid': { const s = pick(['newid']); if (s.S.view !== 'newid') s.preset('newid'); s.S.f = value === 'errors' ? { nick: '바보😀', id: 'toona!', pw: 'abcdefghij', pw2: 'abcdefghik' } : { nick: '송송송', id: 'tunaone2', pw: 'toona1234!', pw2: 'toona1234!' }; s.S.t = { nick: 1, id: 1, pw: 1, pw2: 1 }; s.render(); s.toast(value === 'errors' ? '27p 안내 메시지(에러) 예시' : '모든 필수 항목 입력 — 다음 버튼 활성화'); break; }
    case 'login': {
      const s = pick(['login']); if (s.S.view !== 'login') s.preset('login-filled'); const L = s.S.lg; L.cap = 'ok';
      if (value === 'empty') { L.id = ''; L.pw = ''; s.doLogin(); }
      if (value === 'wrong') { L.id = 'tunaone'; L.pw = 'wrongpass12'; s.doLogin(); }
      if (value === 'fail6') { L.id = 'tunaone'; L.pw = 'wrongpass12'; L.fails = 5; s.doLogin(); }
      if (value === 'withdrawn') { L.id = 'bye'; L.pw = '1234'; s.render(); s.doLogin(); }
      if (value === '2fa') { L.id = 'tunaone'; L.pw = '1234'; s.doLogin(); }
      if (value === 'payco') { s.render(); s.act('sns', { dataset: { v: 'payco' } }); setTimeout(() => s.act('snsmem', { dataset: {} }), 700); }
      break;
    }
    case 'sns': { const s = pick(['login']); if (s.S.view !== 'login') s.preset('login-filled'); s.S.lg.cap = 'ok'; s.act('sns', { dataset: { v: 'kakao' } }); setTimeout(() => s.act(value === 'new' ? 'snsnew' : 'snsmem', { dataset: {} }), 800); break; }
    case 'conv': {
      const s = pick(['login']); if (s.S.view !== 'login') s.preset('login-conv'); const L = s.S.lg; L.cap = 'ok';
      if (value === 'id' || value === 'nosns') { s.S.cv.mode = 'id'; L.id = value === 'id' ? 'toonaone' : 'solo'; L.pw = 'toonation1'; s.render(); s.doLogin(); }
      else { s.render(); s.act('sns', { dataset: { v: 'youtube' } }); setTimeout(() => s.act(value === 'snsid' ? 'snsconv' : 'snsconv2', { dataset: {} }), 700); }
      break;
    }
    case 'pick': { const s = pick(['pick']); s.preset('pick-' + value); s.toast({ c1: '병합 조건 부합 — 병합 계정 리스트 최상단', c2: '병합 조건 미부합 — 연결 계정 리스트', c3: '탈퇴 유예 계정은 선택 불가', c4: '모든 연결 계정이 선택 불가 — [다음] 비활성화' }[value], 2800); break; }
    case 'cnick': { const s = pick(['cnick']); if (s.S.view !== 'cnick') s.preset('cnick'); s.S.cv.nick = value === 'empty' ? '' : '송송😀'; s.S.cv.nt = 1; s.render(); break; }
    case 'snsl': { const s = pick(['snsl']); if (s.S.view !== 'snsl') s.preset('snsl'); s.S.cv.oauth = value === 'ok' ? 'kakao' : 'twitch'; s.act('oa', { dataset: { v: value } }); break; }
    case 'rmt': { const s = pick(['rmt']); s.preset('rmt-' + value); break; }
    case 'find': {
      const s = pick(['fid', 'fidlist', 'fidnone', 'fpw', 'fpwauth', 'fpwreset', 'fpwdone']); const F = s.S.fd;
      if (value.startsWith('id-')) { s.preset('fid'); s.act('fdnext', { dataset: {} }); setTimeout(() => { s.S.modal = 'presult'; s.render(); setTimeout(() => s.act('pr', { dataset: { v: { 'id-ok': 'list', 'id-none': 'none', 'id-fail': 'fail' }[value] } }), 600); }, 500); }
      if (value === 'pw-invalid') { s.preset('fpw'); F.id = 'ab!'; s.act('fpnext', { dataset: {} }); }
      if (value === 'pw-unknown') { s.preset('fpw'); F.id = 'nouser77'; s.act('fpnext', { dataset: {} }); }
      if (value === 'pw-fail') { s.preset('fpwauth'); s.act('fpanext', { dataset: {} }); setTimeout(() => { s.S.modal = 'presult'; s.render(); setTimeout(() => s.act('pr', { dataset: { v: 'fail' } }), 600); }, 500); }
      if (value === 'pw-reset') { s.preset('fpwreset'); Object.assign(F, { pw: 'abcdefghij', pw2: 'abc' }); s.act('frok', { dataset: {} }); }
      break;
    }
    case '2fa': {
      const s = pick(['tfcode', 'tfsel']);
      if (value === 'phone' || value === 'email') { if (s.S.view !== 'tfsel') s.preset('2fa-select'); s.S.tf.m = value; s.render(); setTimeout(() => s.act('tfgo', { dataset: {} }), 400); break; }
      if (s.S.view !== 'tfcode') s.preset('2fa-phone');
      const T = s.S.tf;
      if (value === 'expire') { T.left = 0; T.st = 'expired'; s.render(); }
      if (value === 'wrong') { T.code = '123456'; s.act('tfok', { dataset: {} }); }
      if (value === 'req8') { T.req = 7; s.resend2(); }
      if (value === 'req10') { T.req = 9; s.resend2(); }
      break;
    }
  }
}

/* ---------------- 시작 ---------------- */
DEFS.forEach((d, i) => SCR.push(new Screen(d, i)));
F.append(chip);
if (q.has('inspect')) F.classList.add('inspect');
post({ type: 'ready' });
})();
</script>
