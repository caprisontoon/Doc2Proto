    case 'tab': S.all = { ...S.all, tab: v, cat: '전체', catOpen: false, n: 8 }; render(false); if (NOCAT[v]) toast(`${v === 'chear' ? 'CHEAR' : 'KICK'} 탭 — 카테고리 미제공`); if (v === 'etc') toast('기타 탭 — 치지직 라이브 리스트'); break;

/* ---------------- 기획서 연결 ---------------- */
const post = (m) => { try { parent.postMessage(Object.assign({ d2p: true }, m), '*'); } catch (_) {} };
const refsOf = (x) => x.dataset.spec.split(/\s+(?=\d+:)/);

// 지금 화면에 없는 항목을 가리키면 그 상태로 바꿔서 보여준다
const HINT = {
  127: () => { S.menu = false; }, 126: () => { S.login = true; }, 130: () => { S.login = true; S.pop = 'lang'; }, 131: () => { S.login = true; S.pop = 'cash'; }, 133: () => { S.login = true; S.pop = 'noti'; }, 134: () => { S.login = true; S.pop = 'my'; },

  147: () => { S.route = { n: 'chan', name: '추천 음악/댄스 채널' }; }, 125: () => { S.route = { n: 'group', name: '추천 라이브' }; },
  148: () => { S.route = { n: 'search' }; if (!S.srch.q) { S.srch.q = S.srch.inp = '칸'; } }, 149: () => { S.route = { n: 'search' }; S.srch.q = S.srch.inp = '칸'; S.srch.tab = 'c'; }, 150: () => { S.route = { n: 'search' }; S.srch.q = S.srch.inp = '칸'; S.srch.tab = 'l'; },
  151: () => { S.route = { n: 'search' }; S.srch.q = S.srch.inp = '없는검색어'; S.srch.tab = 'c'; }, 152: () => { S.route = { n: 'search' }; S.srch.q = S.srch.inp = '없는검색어'; S.srch.tab = 'l'; },
};
addEventListener('message', (e) => {
  const m = e.data; if (!m || !m.d2p) return;
  if (m.type === 'focus') {
    const pg = +m.ref.split(':')[0];
    const find = () => $$('[data-spec]').filter((x) => refsOf(x).includes(m.ref) && x.offsetParent !== null);
    let els = find();
    if (!els.length && HINT[pg]) { HINT[pg](); render(); if (m.ref === '148:1b') { S.recentOpen = 'page'; layer(0); } els = find(); }
    if (els[0]) els[0].scrollIntoView({ block: 'nearest' });

});
function runEvent(name, value) {

// state: home-out(로그인 전 1/4) · home-cheer(2/4) · home-top(3/4) · home-foot(4/4) · home-in(로그인 후) · home-closed(메뉴 닫힘) · lang · cash · noti · my
//        group · all · all-cat · all-<탭> · all-etc-cat · all-ow · all-end · popular · popular-top · chan · search-recent · search · search-live · search-none · search-none-live
function applyState(st) {
  S = fresh();
  const P = st.split('-');

  S.bare = bare;
  if (P[0] === 'home') {
    if (P[1] === 'in' || P[1] === 'closed') { S.login = true; S.notice = false; }

    if (P[1] === 'closed') S.menu = false;
    if (P[1] === 'cheer' || P[1] === 'top' || P[1] === 'foot') S.notice = false;
  } else if (['lang', 'cash', 'noti', 'my'].includes(P[0])) { S.login = true; S.notice = false; S.menu = false; S.pop = P[0]; }

  else if (P[0] === 'chan') { S.route = { n: 'chan', name: '추천 음악/댄스 채널' }; S.hist = [{ n: 'popular' }]; }
  else if (P[0] === 'search') {
    S.route = { n: 'search' };
    S.srch.q = S.srch.inp = P[1] === 'none' ? '없는검색어' : '칸';
    if (P[1] === 'none') S.srch.inp = '칸';   // 기획서 화면은 입력칸에 '칸'

  if (st === 'all-end') ct.scrollTop = 1e6;
  if (st === 'popular-top') at('#s-ptop', 20);

  if (st === 'search' || st === 'search-recent') { const x = $('.vtg .q'); if (x) { S.srch.tip = true; x.innerHTML = '?<span class="stip">일정기간 활동을 바탕으로<br>투네이션에서 인증한 크리에이터입니다.</span>'; } }
}
applyState(ST0);
if (q.has('inspect')) F.classList.add('inspect');
post({ type: 'ready' });
})();
