<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff}</style>
</head>
<body>
<div id="frame"></div>
<script>
/* 투네이션 리모컨 > 후원 리스트 위젯 동작 프로토타입 (리모컨 개편 상세기획 v0.21 38~59p)

(function () {
'use strict';
const q = new URLSearchParams(location.search || location.hash.slice(1));
const EMBED = q.has('embed');
const ST0 = q.get('state') || 'all';

const u = (n) => `calc(${n}*var(--u))`;

  chip.textContent = refsOf(el).map((x) => x.replace(':', 'p ')).join(' · ');
  chip.style.display = 'block'; chip.style.left = Math.max(0, Math.min(r.left - fr.left, fr.width - chip.offsetWidth)) + 'px'; chip.style.top = Math.max(0, r.top - fr.top - 12) + 'px';
});
addEventListener('message', (e) => {
  const m = e.data; if (!m || !m.d2p) return;
  if (m.type === 'focus') {
    const pg = +m.ref.split(':')[0];
    let els = $$('[data-spec]').filter((x) => refsOf(x).includes(m.ref) && x.offsetParent !== null);
    if (!els.length) {
      const hint = { 42: () => openOv('filter'), 52: () => openOv('filter'), 44: () => go('game'), 53: () => go('game'), 45: () => go('gacha'), 54: () => go('gacha'), 55: () => go('gacha'), 46: () => { go('gacha'); renderQty(); $('#qty').classList.add('on'); }, 56: () => { go('gacha'); renderQty(); $('#qty').classList.add('on'); }, 47: () => openSearch(), 57: () => openSearch(), 48: () => { openSearch(); openOv('sopt'); }, 58: () => { openSearch(); openOv('sopt'); } }[pg];
      if (hint) { hint(); els = $$('[data-spec]').filter((x) => refsOf(x).includes(m.ref) && x.offsetParent !== null); }
    }
    els.slice(0, 6).forEach((x) => { x.classList.remove('spec-flash'); void x.offsetWidth; x.classList.add('spec-flash'); setTimeout(() => x.classList.remove('spec-flash'), 3200); });
    post({ type: 'focused', ref: m.ref, count: els.length });
  } else if (m.type === 'inspect') F.classList.toggle('inspect', !!m.on);
  else if (m.type === 'event') runEvent(m.name, m.value);
  else if (m.type === 'state') applyState(m.state);
  else if (m.type === 'changed') {
    $$('[data-chg]').forEach((x) => x.removeAttribute('data-chg'));
    const set = new Set(m.refs || []);
    $$('[data-spec]').forEach((x) => { if (refsOf(x).some((r) => set.has(r))) x.setAttribute('data-chg', '변경'); });
  }
});
function go(tab) { S.search = newSearch(); S.tab = tab; S.badge[tab] = 0; S.checked.clear(); closeOv(); render(); }
function openSearch() { go('gacha'); S.search.open = true; render(); }
let seq = 100;
function runEvent(name, value) {
  switch (name) {
    case 'new': {
      const now = (Date.now() - S.t0) / -1000;   // 방금
      if (value === 'game') S.game.unshift({ ...mkGame()[0], id: 'g' + ++seq, at: now, nick: NICKS[seq % NICKS.length] });
      else if (value === 'gacha') {
        const ids = []; for (let i = 0; i < 10; i++) { const r = { ...mkGacha(1)[0], id: 'p' + ++seq, at: now, done: false, nick: '열혈팬1호', prize: ['빼빼로', '초콜릿', '리액션', '꽝'][i % 4] }; S.gacha.unshift(r); ids.push(r.id); }
        S.playing = ids; S.badge.gacha += 10; render(); toast('뽑기 10연차 — 재생 중 강조가 10개 행에 표시돼요'); return;
      } else { const t = [['텍스트', '', '방금 들어온 후원이에요! 오늘 방송 최고'], ['영상', '', '방금 보낸 영상 후원', 'video'], ['룰렛', '', '행운 룰렛 – 당첨 리액션']][seq % 3]; S.all.unshift({ id: 'a' + ++seq, tab: 'all', type: t[0], sub: t[1], c: t[2], thumb: t[3] || '', nick: NICKS[seq % NICKS.length], cash: 3000, at: now }); }
      S.badge[value === 'game' ? 'game' : 'all']++;
      render(); toast(`새 후원 도착 — ${value === 'game' ? '게임' : '통합 알림'} 탭 배지 +1 (탭을 눌러 확인하면 꺼져요)`); break;
    }
    case 'playnext': {
      const R = rowsOf(S.tab); if (!R.length) break;
      const i = R.findIndex((r) => r.id === S.playing[0]); const nx = R[(i + 1 + R.length) % R.length]; S.playing = [nx.id]; render();
      toast('통합 알림창에서 재생 중인 후원이 바뀌었어요'); break;
    }
    case 'playstop': S.playing = []; render(); toast('재생 종료 — 강조 표시 해제'); break;
    case 'view': if (NARROW_FRAME && value === 'wide') { toast('이 페이지는 좁은 위젯 예시예요'); break; } S.view = value; S.open = null; closeOv(); render(); toast(value === 'narrow' ? '위젯 폭이 좁아지면 카드 형식으로 바뀌어요 (반응형)' : '넓은 위젯 — 표 형식'); break;
    case 'block': { const r = rowsOf('all')[4]; S.tab = 'all'; S.blocked.has(r.nick) ? S.blocked.delete(r.nick) : S.blocked.add(r.nick); render(); toast(S.blocked.has(r.nick) ? `${r.nick} 차단` : '차단 해제'); break; }
    case 'bigsearch': openSearch(); S.search.big = true; doSearch(); break;
  }
}

/* ---------------- 초기 상태 ---------------- */
const iso = (d) => d.toISOString().slice(0, 10);
function newSearch() { const t = new Date(); return { open: false, q: '', results: null, big: false, opt: { name: '전체', from: iso(new Date(t.getTime() - 30 * 86400000)), to: iso(t), field: '전체' } }; }
function applyState(st) {
  Object.assign(S, {
    t0: Date.now(), tab: 'all', view: NARROW_FRAME ? 'narrow' : 'wide', sort: 'recent', filter: new Set(FKEYS), blocked: new Set(), playing: [], checked: new Set(), open: null,
    badge: { all: 0, game: 0, gacha: 0 }, cw: {}, all: mkAll(), game: mkGame(), gacha: mkGacha(), search: newSearch(), qtyName: GNAMES[0], cmcf: false,
  });
  S.hist = [...S.gacha, ...mkGacha(30).map((r, i) => ({ ...r, id: 'h' + i, at: (i + 1) * 86400 * 2.3, done: i % 4 === 0, gname: GNAMES[i % 3] }))];
  closeOv(); $('#qty').classList.remove('on'); $('#bigt').style.display = 'none';
  const s = st.replace(/^n-/, '');
  S.playing = [S.all[6].id];
  if (s === 'all' || s === 'block') S.blocked.add(S.all[4].nick);
  if (s === 'filter' || s === 'badge') S.badge = { all: 25, game: 3, gacha: 2 };
  if (s === 'game') { S.tab = 'game'; S.playing = [S.game[2].id]; }
  if (s.startsWith('gacha') || s.startsWith('search')) { S.tab = 'gacha'; S.playing = [S.gacha[2].id]; }
  if (s === 'gacha-check') S.gacha.filter((r) => !r.done).slice(0, 5).forEach((r) => S.checked.add(r.id));
  if (s === 'open') S.open = S.all[2].id;
  if (s.startsWith('search')) S.search.open = true;
  render();
  if (s === 'filter') openOv('filter');
  if (s === 'gacha-qty') { renderQty(); $('#qty').classList.add('on'); }
  if (s === 'search-opt') openOv('sopt');
  if (s === 'search-result') { S.search.big = true; doSearch(); }
  if (s === 'sync') { S.playing = [S.all[11].id]; render(); setTimeout(() => { const sc = $('#scr'); sc.scrollTop = 40; updFabs(); }, 0); }
}
applyState(ST0);
setInterval(() => { if (!S.search.open && !OV.classList.contains('on') && !TIP.matches(':hover')) { const sc = $('#scr'), y = sc ? sc.scrollTop : 0; render(); const s2 = $('#scr'); if (s2) s2.scrollTop = y; updFabs(); } }, 30000);   // 시간 표기 갱신
if (q.has('inspect')) F.classList.add('inspect');
post({ type: 'ready' });
})();
