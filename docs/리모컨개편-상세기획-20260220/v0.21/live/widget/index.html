<body>
<div id="frame"></div>
<script>
/* 투네이션 리모컨 > 기타 위젯 동작 프로토타입 (리모컨 개편 상세기획 v0.21 61~84p)
   state = "위젯[|기획서상 창 폭 pt]" — 창 폭(pt)으로 화면을 맞추고 높이는 프레임을 채운다. 폭 300pt 이상이면 넓은 레이아웃.
   data-spec="페이지:항목" 은 기획서 Description 항목 */
(function () {
'use strict';
const q = new URLSearchParams(location.search || location.hash.slice(1));
const EMBED = q.has('embed');
const [ST0, W0] = (q.get('state') || 'wait|165').split('|');
const FW = +W0 || 165;
const WIDE = FW >= 300;

const u = (n) => `calc(${n}*var(--u))`;

const CSS = `

.left{margin:${u(6)} auto ${u(3)};text-align:center;background:#eef0f3;border-radius:${u(6)};padding:${u(2)} ${u(8)};width:max-content;font-weight:700}
/* 볼륨 */
.vr{display:grid;grid-template-columns:${u(30)} 1fr ${u(18)};gap:${u(4)};align-items:center;margin:${u(6)} ${u(6)};font-weight:700}
.vr input{width:100%;accent-color:#5bc4ea}.vr em{font-style:normal;font-weight:400;color:#777;font-size:.85em;text-align:right}
/* 후원 사용·알림 */
.master{margin:${u(5)};background:#33363d;color:#fff;border-radius:${u(3)};padding:${u(6)};display:flex;align-items:center;gap:${u(4)}}

.crt{width:100%;border-collapse:collapse;font-size:${u(6)}}

document.head.insertAdjacentHTML('beforeend', `<style>${CSS}</style>`);

const F = document.getElementById('frame');
F.innerHTML = `<div id="win"><div id="tb"></div><div id="body"></div></div><div class="ov" id="ov"></div><div class="toast" id="toast"></div>
<div class="closed" id="closed"><b>위젯을 닫았어요</b><span>Dock의 아이콘을 눌러 다시 열 수 있어요</span><button class="btn b-bk" data-act="reopen">다시 열기</button></div><div id="chip"></div>`;
const $ = (s) => F.querySelector(s);
const $$ = (s) => [...F.querySelectorAll(s)];
const BODY = $('#body'), OV = $('#ov');
let K = 1;
function fit() { K = innerWidth / FW; document.documentElement.style.setProperty('--u', K + 'px'); }
addEventListener('resize', fit); fit();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const won = (n) => (+n).toLocaleString('en-US');
const mmss = (s) => `${String(Math.floor(Math.max(0, s) / 60)).padStart(2, '0')}:${String(Math.max(0, s) % 60).padStart(2, '0')}`;
let toastT;
function toast(m, err) { const t = $('#toast'); t.textContent = m; t.className = 'toast show' + (err ? '' : ' info'); clearTimeout(toastT); toastT = setTimeout(() => (t.className = 'toast'), err ? 2800 : 2400); }
const tg = (on, act, extra = '') => `<span class="tg ${on ? 'on' : ''}" data-act="${act}" ${extra}><i>${on ? 'ON' : 'OFF'}</i></span>`;

const S = {};
const TITLE = { quick: '퀵 제어', wait: '대기 중인 후원', vol: '볼륨 제어', use: '후원 사용', alert: '후원 알림', video: '영상 후원 제어', gqty: '뽑기 잔여 수량', vote: '투표', crew: '크루 후원', ad: '투네애드' };
const kindOf = (st) => ({ wvideo: 'wait', quest: 'wait', lucky: 'wait', play: 'wait', 'play-mc': 'wait', 'vote-toast': 'vote', 'vote-filled': 'vote', 'vote-run': 'vote', 'crew-none': 'crew', 'crew-live': 'crew', 'ad-detail': 'ad', 'n-ad': 'ad', 'gqty-none': 'gqty' }[st] || st);

/* ---------------- 창 ---------------- */
function renderTitle() {
  const k = S.kind; let extra = '';
  if (k === 'wait') extra = `<span class="bd" data-spec="63:2">${S.wait.length}</span>`;
  if (k === 'ad') extra = `<span class="bd" data-spec="82:1" title="집행하지 않은 광고 수">${S.ads.filter((a) => !a.done).length}</span>`;
  if (k === 'vote' && S.vote.status !== 'idle') {
    const st = S.vote.status, left = S.vote.end - Date.now();
    extra = st === 'run' ? `<span class="st b-rd" data-spec="75:1">투표 진행 중 · ${hms(left)}</span>` : st === 'pause' ? `<span class="st b-tl" data-spec="75:1">투표 정지 중</span>` : `<span class="st b-ol" data-spec="75:1">예약 대기 중 · ${hms(S.vote.start - Date.now())}</span>`;

    : `<div class="t">방송 설정이 필요합니다.<a data-act="clink" data-spec="79:2">방송 설정 페이지 ></a></div>`;
  const btn = live ? `<button class="btn b-rd" data-act="cend" data-spec="80:2">방송 종료</button>` : `<button class="btn ${set ? 'b-gr' : 'b-gy'}" data-act="cstart" ${set ? '' : 'disabled'} data-spec="79:4">방송 시작</button>`;
  const rows = set ? [...CREW].map((r, i) => [...r, S.crew.score[i]]).sort((a, b) => b[3] - a[3]) : [];

    : `<table class="crt"><tr><th>직급</th><th>크루 명</th><th>후원점수</th><th>기여도</th></tr><tr><td colspan="4" style="height:${u(120)};color:#666;line-height:1.6">등록된 크루원이 없습니다.<br>크루원 설정을 통해 크루원을 추가해 주세요.</td></tr></table>`;
  return `<div class="vbox crew-top" data-spec="${set ? (live ? '80:1' : '79:3') : '79:1'}">${top}${btn}</div>
    <div class="vbox"><h6>시즌 명</h6><div class="ebox">${set ? '오프오프 시즌' : ''}</div></div><div class="vbox"><h6>방송 제목</h6><div class="ebox">${set ? '마지막 직급 대전' : ''}</div></div>
    <div class="vbox"><h6>방송 참여 크루</h6><div style="overflow-x:auto">${table}</div></div>`;
}

/* ---------------- 투네애드 (81~84p) ---------------- */

/* ---------------- 이벤트 ---------------- */
F.addEventListener('click', (e) => {

    case 'vno': dropW(k, '영상 후원 거절 — 통합 알림 리스트에 노출'); break;
    case 'qacc': w.acc = true; w.left = 300; render(); toast('퀘스트 수락 — 버튼이 성공/실패로 바뀌고 수행 시간이 시작돼요'); break;
    case 'qrej': dropW(k, '퀘스트 거절 — 후원이 사라지고 통합 알림 리스트에 남지 않아요'); break;

    case 'qfail': dropW(k, `통합 알림 리스트에 '${w.title} – 실패'로 노출`); break;
    case 'lpick': w.pick = +a.dataset.n; render(); break;
    case 'lsel': dropW(k, `${w.pick}번 선택 — 결과(${Math.random() < .5 ? '당첨' : '꽝'})가 통합 알림 리스트에 노출`); break;
    case 'pgo': w.ch = true; S.view = { p: 'play', k, left: w.limit }; render(); break;
    case 'popt': S.view.sel = +a.dataset.i; render(); break;
    case 'pgive': dropW(S.view.k, '포기 — 오답 처리되어 통합 알림 리스트에 노출'); break;
    case 'psub': { const wv = S.wait.find((x) => x.k === S.view.k); const ok = wv.kind === 'mc' ? S.view.sel === 0 : /^(서울|사과|꽃)/.test((S.view.txt || '').trim()) || (S.view.txt || '').trim() === '소원티비공식'; dropW(S.view.k, `정답 제출 — ${ok ? '정답' : '오답'} 처리, 통합 알림 리스트에 노출`); break; }

    case 'use': if (!S.useAll) { toast('후원 기능 사용이 꺼져 있어요'); break; } S.use[a.dataset.k] = !S.use[a.dataset.k]; render(); toast(`${a.dataset.k} ${S.use[a.dataset.k] ? 'on — 후원페이지에 탭 노출' : 'off — 후원페이지 탭 비노출'}`); break;
    case 'al': S.al[a.dataset.k] = !S.al[a.dataset.k]; render(); break;
    case 'vauto': S.vAuto = !S.vAuto; render(); toast(S.vAuto ? '자동 재생 ON — 영상 후원을 바로 재생' : '자동 재생 OFF — 대기 중인 후원에서 확인 후 수락'); break;
    case 'vvoice': S.vVoice = !S.vVoice; render(); toast(S.vVoice ? '음성만 재생 — 영상은 노출되지 않아요' : '영상과 음성 함께 재생'); break;
    // 투표

    case 'vdel': readVote(); S.vote.items.splice(+a.dataset.i, 1); render(); break;
    case 'vresv': readVote(); S.vote.resv = !S.vote.resv; render(); break;
    case 'vstart': startVote(); break;
    case 'vpause': S.vote.status = 'pause'; S.vote.rest = S.vote.end - Date.now(); render(); toast('투표 정지 — 예상 종료 시간이 "투표 정지 중"으로 바뀌어요'); break;

    case 'vend': S.vote.status = 'idle'; render(); toast('투표 종료'); break;
    // 크루
    case 'clink': toast('크리에이터 페이지의 [크루 후원 위젯 설정]으로 새 창 이동'); break;
    case 'cstart': confirm('방송 시작', '크루 방송을 시작 하시겠습니까?', () => { S.crew.st = 'live'; render(); toast('크루 방송 시작 — 후원점수가 실시간 집계돼요'); }); break;
    case 'cend': confirm('방송 종료', '크루 방송을 종료 하시겠습니까?', () => { S.crew.st = 'ended'; render(); }); break;
    case 'cok': S.crew.st = 'none'; render(); break;
    case 'cfy': { const f = S.cf; OV.classList.remove('on'); f && f(); break; }
    // 투네애드
    case 'adauto': S.adAuto = !S.adAuto; renderTitle(); if (BARE) render(); toast(S.adAuto ? '광고 자동 재생 ON' : '광고 자동 재생 OFF'); break;
    case 'adet': if (e.target.closest('.ops')) break; adDetail(ad); break;
    case 'aopen': if (e.target.closest('.bar')) break; S.aopen = S.aopen === ad.id ? null : ad.id; render(); break;
    case 'aplay': e.stopPropagation(); OV.classList.remove('on'); playAd(ad); break;
    case 'askip': e.stopPropagation(); OV.classList.remove('on'); S.ads = S.ads.filter((x) => x !== ad); render(); toast('SKIP — 광고 재생 목록과 리스트에서 제외'); break;
  }
});
function confirm(h, p, yes) { S.cf = yes; OV.innerHTML = `<div class="modal" data-spec="79:4"><h4>${h}</h4><p>${p}</p><div class="bb"><button class="btn b-gy" data-act="ovx">취소</button><button class="btn b-bk" data-act="cfy">확인</button></div></div>`; OV.classList.add('on'); }
F.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.vol !== undefined) { S.vols[+t.dataset.vol] = +t.value; t.nextElementSibling.textContent = t.value + '%'; }

F.addEventListener('change', (e) => {

});
// 1초 타이머: 남은 시간, 투표, 크루, 광고
setInterval(() => {
  let ch = false;
  if (S.kind === 'wait') {
    for (const w of [...S.wait]) {
      w.left--;
      if (w.left <= 0) {
        if (w.t === 'quest' && w.acc) dropW(w.k, `수행 시간 초과 — '${w.title} – 실패'로 리스트에 노출`);
        else dropW(w.k, w.t === 'lucky' ? '시간 초과 — 리스트에 \'럭키박스 – 시간초과 환불\'로 노출' : '시간 초과 — 자동 환불, 리스트에 남지 않아요');
      }
    }
    if (S.view && S.view.p === 'play') { S.view.left--; if (S.view.left <= 0) dropW(S.view.k, '제한 시간 초과 — 오답 처리'); }
    ch = !S.view || S.view.p === 'play';
    if (ch) { // 입력 중엔 화면을 다시 그리지 않고 시간만 갱신
      if (S.view) { const l = $('.left'); if (l) l.textContent = `남은 시간 ${String(Math.floor(S.view.left / 60)).padStart(2, '0')}분 ${String(S.view.left % 60).padStart(2, '0')}초`; }
      else $$('.card').forEach((c) => { const w = S.wait.find((x) => x.k === +c.dataset.k); const t = c.querySelector('.tm'); if (w && t) { t.textContent = `[남은 시간] ${mmss(w.left)}`; t.classList.toggle('warn', w.left <= 10); } });
    }

  if (S.kind === 'vote' && S.vote.status !== 'idle') {

    if (v.status === 'run' && Date.now() >= v.end) { v.status = 'idle'; render(); toast('투표 시간이 끝났어요'); }

  if (S.kind === 'crew' && S.crew.st === 'live' && Math.random() < .5) { S.crew.score[Math.floor(Math.random() * CREW.length)] += [10, 50, 100][Math.floor(Math.random() * 3)]; if (!OV.classList.contains('on')) render(); }
  if (S.kind === 'ad') { const a = S.ads.find((x) => x.play); if (a) { a.left--; if (a.left <= 0) { a.play = false; a.done = true; a.at = new Date().toLocaleString('sv-SE').slice(0, 16); toast('광고 집행 완료 — 행이 회색으로 바뀌어요'); } render(); } }
}, 1000);

/* ---------------- 기획서 연결 ---------------- */
const post = (m) => { try { parent.postMessage(Object.assign({ d2p: true }, m), '*'); } catch (_) {} };
const refsOf = (x) => x.dataset.spec.split(/\s+(?=\d+:)/);
F.addEventListener('click', (e) => {
  const el = e.target.closest('[data-spec]'); if (!el) return;
  post({ type: 'spec', refs: refsOf(el), label: (el.title || el.textContent || '').trim().slice(0, 30) });
}, true);
F.addEventListener('mouseover', (e) => {
  if (!F.classList.contains('inspect')) return;
  const el = e.target.closest('[data-spec]'), chip = $('#chip');
  if (!el) { chip.style.display = 'none'; return; }
  const r = el.getBoundingClientRect(), fr = F.getBoundingClientRect();
  chip.textContent = refsOf(el).map((x) => x.replace(':', 'p ')).join(' · ');
  chip.style.display = 'block'; chip.style.left = Math.max(0, Math.min(r.left - fr.left, fr.width - chip.offsetWidth)) + 'px'; chip.style.top = Math.max(0, r.top - fr.top - 12) + 'px';
});
addEventListener('message', (e) => {
  const m = e.data; if (!m || !m.d2p) return;
  if (m.type === 'focus') {
    const els = $$('[data-spec]').filter((x) => refsOf(x).includes(m.ref) && x.offsetParent !== null).slice(0, 6);
    els.forEach((x) => { x.classList.remove('spec-flash'); void x.offsetWidth; x.classList.add('spec-flash'); setTimeout(() => x.classList.remove('spec-flash'), 3200); });
    if (els[0]) els[0].scrollIntoView({ block: 'nearest' });
    post({ type: 'focused', ref: m.ref, count: els.length });
  } else if (m.type === 'inspect') F.classList.toggle('inspect', !!m.on);
  else if (m.type === 'event') runEvent(m.name, m.value);
  else if (m.type === 'state') applyState(m.state.split('|')[0]);
  else if (m.type === 'changed') {
    $$('[data-chg]').forEach((x) => x.removeAttribute('data-chg'));
    const set = new Set(m.refs || []);
    $$('[data-spec]').forEach((x) => { if (refsOf(x).some((r) => set.has(r))) x.setAttribute('data-chg', '변경'); });
  }
});
let seq = 50;
function runEvent(name, value) {
  switch (name) {
    case 'wadd': if (S.kind !== 'wait') { toast('대기 중인 후원 위젯 예시에서 동작해요'); break; } S.view = null; S.wait.unshift(mkWait(value)); render(); toast(`${TPN[value]} 후원 도착 — 배지 ${S.wait.length}`); break;
    case 'timeout': if (S.kind !== 'wait' || !S.wait.length) break; S.wait[0].left = 1; toast('첫 번째 후원의 남은 시간을 끝냈어요'); break;
    case 'nogacha': if (S.kind !== 'gqty') break; S.noGacha = !S.noGacha; render(); break;
    case 'votefill': if (S.kind !== 'vote') break; S.vote.status = 'idle'; Object.assign(S.vote, { name: '프리미어리그 우승팀은?', preset: true, h: '00', m: '30', s: '00', cash: '1000', free: '0', items: ['맨시티', '아스날', '리버풀'] }); render(); break;
    case 'crewset': if (S.kind !== 'crew') break; S.crew.st = S.crew.st === 'none' ? 'set' : 'none'; render(); break;
    case 'adnew': if (S.kind !== 'ad') break; S.ads.unshift({ id: 'a' + ++seq, who: '새 광고주', cash: 1500, title: '신규 광고 타이틀', len: 30, ok: true }); render(); toast('새 광고 도착 — 배지 +1'); break;
  }
}

/* ---------------- 초기 상태 ---------------- */
function mkWait(t, extra = {}) {
  const base = { k: ++seq, t, nick: '후원닉네임후원닉…', cash: 3000, left: 120, title: '성공하면 한강 입수', limit: 60, kind: 'mc' };
  return Object.assign(base, extra);
}
function applyState(st) {
  S.kind = kindOf(st); S.view = null; S.pin = false; S.cf = null;
  $('#win').classList.remove('mini'); $('#closed').classList.remove('on'); OV.classList.remove('on');
  Object.assign(S, { qtab: 0, paused: [false, false, false], vols: [75, 40, 85, 70, 35, 85, 40], useAll: true, use: Object.fromEntries(USE.map((x) => [x, !['미니', '그림', '게임', '크루'].includes(x)])),
    al: Object.fromEntries(ALERTS.flatMap((x) => x[1]).map((x) => [x, true])), vAuto: true, vVoice: false, gname: '크리스마스 뽑기', noGacha: st === 'gqty-none',
    vote: { status: 'idle', name: '', preset: false, h: '00', m: '00', s: '00', cash: '1000', free: '0', items: ['', ''], resv: false, at: '' },
    crew: { st: st === 'crew-none' ? 'none' : st === 'crew-live' ? 'live' : 'set', score: CREW.map((c) => c[2]) }, adAuto: true, aopen: null,
    ads: Array.from({ length: 11 }, (_, i) => ({ id: 'a' + i, who: '광고주 명', cash: 1000, title: i === 2 ? '광고 타이틀 (집행 조건 미충족)' : '광고 타이틀', len: 30 + i * 5, ok: i !== 2, done: i >= 7, at: '2026-02-19 21:3' + (i % 10) })) });
  const W = {
    wait: () => [mkWait('video'), mkWait('quest'), mkWait('lucky'), mkWait('play'), mkWait('lucky', { nick: '침착맨' })],
    wvideo: () => [mkWait('video'), mkWait('quest'), mkWait('lucky'), mkWait('play')],
    quest: () => [mkWait('quest', { nick: '도네이터 닉네임' })],
    lucky: () => [mkWait('lucky', { nick: '침착맨' })],
    play: () => [mkWait('play', { nick: '도네이터닉네임', kind: 'mc' }), mkWait('play', { nick: '초성왕', kind: 'short' }), mkWait('play', { nick: '그림쟁이', kind: 'draw' })],
  };
  S.wait = (W[st] || W.wait)();
  if (st === 'vote-filled' || st === 'vote-run') Object.assign(S.vote, { name: '프리미어리그 우승팀은?', preset: true, h: '00', m: '30', s: '00', cash: '1000', free: '0', items: ['맨시티', '아스날', '리버풀'] });
  if (st === 'vote-run') Object.assign(S.vote, { status: 'run', start: Date.now(), end: Date.now() + 1800000 });
  render();
  if (st === 'vote-toast') setTimeout(() => startVote(), 300);
  if (st === 'ad-detail') adDetail(S.ads[2]);
}
applyState(ST0);
if (q.has('inspect')) F.classList.add('inspect');
post({ type: 'ready' });
