<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투네이션 리모컨 — 동작 프로토타입</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff}</style>
</head>
<body>
<div id="frame"></div>
<script>
/* 투네이션 크리에이터 리모컨 동작 프로토타입 (리모컨 개편 상세기획 v0.21 9~28p)
   좌표·크기 단위 = 기획서 슬라이드의 pt (메인 창 585.3 × 356). data-spec="페이지:항목" 은 기획서 Description 항목.
   레이아웃 = 이진 분할 트리 { t:'s', dir:'h'|'v', r, a, b } / { t:'w', id } — 위젯 추가는 대상 영역을 ½ 분할, 삭제·이동은 분할 상대가 자리를 채움 */
(function () {
'use strict';
const q = new URLSearchParams(location.search || location.hash.slice(1));
const EMBED = q.has('embed');
const ST0 = q.get('state') || 'live';
const MODES = { normal: [585.3, 356], desktop: [744, 362], window: [327.4, 334.8] };
const MODE = /^desk|^magnet/.test(ST0) ? 'desktop' : ST0 === 'window' ? 'window' : 'normal';
const [FW, FH] = MODES[MODE];
const DESK = MODE !== 'normal';
const WW = 585.3, WH = 356;                 // 메인 창
const CX = 3, CY = 31, CW = WW - 3 - 16, CH = WH - 31 - 3;   // 캔버스 (창 기준)
const G = 1.5;                               // 위젯 사이 간격
const u = (n) => `calc(${n}*var(--u))`;

const CSS = `
:root{--u:1px;--fs:1;--blue:#3d6df2;--ink:#23252b;--sub:#6b6f7a;--line:#dfe1e7;--bar:#6f7178;--nb:#e5e6ea;--cv:#2a2c31;--wh:#eef0f3;--wb:#fff;--chip:#f3f4f7;--off:#9a9da6;--desk:#f4f5f8}
.dark{--ink:#e7e8ec;--sub:#9a9eaa;--line:#3a3d45;--bar:#18191d;--nb:#26282e;--cv:#0e0f12;--wh:#2c2e35;--wb:#1d1f24;--chip:#2a2c33;--off:#5b5e67;--desk:#121317}
*{box-sizing:border-box}
body{font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
#frame{position:relative;width:${u(FW)};height:${u(FH)};overflow:hidden;font-size:${u(6)};color:var(--ink);background:${DESK ? 'var(--desk)' : 'var(--cv)'};user-select:none;-webkit-user-select:none}
${EMBED ? '' : '#frame{margin:0 auto;box-shadow:0 2px 18px rgba(0,0,0,.18)}body{display:flex;align-items:center;justify-content:center;background:#e9ebef}'}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.abs{position:absolute}
#deskL{left:${u(6)};bottom:${u(4)};font-size:${u(5.5)};color:var(--sub);opacity:.7}
/* 메인 창 */
#win{position:absolute;width:${u(WW)};height:${u(WH)};background:var(--cv);border:${u(.8)} solid #5c5e64;box-shadow:${DESK ? `0 ${u(2)} ${u(10)} rgba(0,0,0,.25)` : 'none'}}
#tb{left:0;top:0;width:100%;height:${u(15)};background:var(--bar);display:flex;align-items:center;padding:0 ${u(5)};color:#fff;cursor:${DESK ? 'move' : 'default'}}
#bi{text-decoration:none;display:flex;align-items:center;gap:${u(2)};font-size:${u(7)};font-weight:700;letter-spacing:-.02em;color:#eef}
#bi i{font-style:normal;color:#4b8bff;font-size:${u(9)};font-weight:900;line-height:1}
#tbb{margin-left:auto;display:flex;gap:${u(5)}}
#tbb button{width:${u(10)};height:${u(10)};display:flex;align-items:center;justify-content:center;font-size:${u(7)};color:#fff;border-radius:${u(2)}}
#tbb button:hover{background:rgba(255,255,255,.18)}
#tbb button.on{color:#ffd23f}
#nb{left:0;top:${u(15)};width:100%;height:${u(14)};background:var(--nb);display:flex;align-items:center;padding:0 ${u(5)};gap:${u(4)};font-weight:700;font-size:${u(6.4)}}
#nb .tx{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nb .tx:hover{text-decoration:underline}
#nbr{margin-left:auto;display:flex;gap:${u(5)};align-items:center}
#nbr button{position:relative;width:${u(11)};height:${u(11)};display:flex;align-items:center;justify-content:center;font-size:${u(8)}}
#nbr .bd{position:absolute;right:${u(-3)};top:${u(-2)};min-width:${u(7)};height:${u(7)};border-radius:${u(4)};background:#e5322d;color:#fff;font-size:${u(4.8)};font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 ${u(1.5)}}
#cv{left:${u(CX)};top:${u(CY)};width:${u(CW)};height:${u(CH)};background:var(--cv)}
#strip{right:${u(2)};top:${u(CY)};width:${u(12)};bottom:${u(3)};background:#000;display:flex;align-items:center;justify-content:center}
#strip button{width:${u(11)};height:${u(14)};color:#fff;font-size:${u(9)};display:flex;align-items:center;justify-content:center;border-radius:${u(2)}}
#strip button:hover{background:#333}
/* 위젯 */
.wg{position:absolute;display:flex;flex-direction:column;background:var(--wb);border:${u(.7)} solid #55585f;overflow:hidden}
.wh{flex:none;height:${u(12)};background:var(--wh);display:flex;align-items:center;padding:0 ${u(2)} 0 ${u(4)};font-weight:700;font-size:${u(5.8)};cursor:grab;gap:${u(2)}}
.wh .bdg{background:#e5322d;color:#fff;border-radius:${u(3)};font-size:${u(4.6)};padding:0 ${u(2)};min-width:${u(7)};text-align:center}
.wh .wb{margin-left:auto;display:flex;gap:${u(1)}}
.wh .wb button{width:${u(9)};height:${u(9)};display:flex;align-items:center;justify-content:center;font-size:${u(6)};border-radius:${u(2)};color:var(--sub)}
.wh .wb button:hover{background:rgba(0,0,0,.08)}
.wh .wb button.pin.on{color:#f0a400}
.wc{flex:1;min-height:0;overflow:auto;font-size:calc(5.4*var(--u)*var(--fs));padding:${u(3)}}
.wc::-webkit-scrollbar{width:${u(3)};height:${u(3)}}.wc::-webkit-scrollbar-thumb{background:#bbb;border-radius:${u(2)}}
.wg.mini .wc{display:none}
.wg.dim{opacity:.35}
.wg.ghost{opacity:.6;pointer-events:none;z-index:300;box-shadow:0 ${u(3)} ${u(14)} rgba(0,0,0,.45)}
.wg.adding{z-index:150;box-shadow:0 ${u(4)} ${u(18)} rgba(0,0,0,.55),0 0 0 ${u(1.5)} #35c4ff;cursor:grab}
.wg.adding.dragging{opacity:.6}
.wg.flash{animation:wflash .9s ease 2}
@keyframes wflash{50%{box-shadow:inset 0 0 0 ${u(2.5)} #35c4ff}}
.fw{z-index:20;box-shadow:0 ${u(2)} ${u(10)} rgba(0,0,0,.28)}
.fw .rs{position:absolute;right:0;bottom:0;width:${u(8)};height:${u(8)};cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,#9a9da6 50%,#9a9da6 60%,transparent 60%,transparent 70%,#9a9da6 70%,#9a9da6 80%,transparent 80%)}
.sp{position:absolute;z-index:6}
.sp.h{cursor:col-resize}.sp.v{cursor:row-resize}
.sp:hover,.sp.act{background:rgba(53,196,255,.55)}
.hl-sp .sp{background:rgba(229,50,45,.55)}
/* 위젯 내용 */
.tabs{display:flex;gap:${u(1)};margin-bottom:${u(3)};align-items:center}
.tabs b{flex:1;max-width:${u(52)};text-align:center;padding:${u(2.5)} 0;background:var(--chip);color:var(--sub);font-weight:400;cursor:pointer;border-radius:${u(1.5)} ${u(1.5)} 0 0}
.tabs b.on{background:var(--wb);color:var(--ink);font-weight:700;box-shadow:inset 0 ${u(-1.2)} 0 var(--ink)}
.tabs .fl{margin-left:auto;width:${u(9)};height:${u(9)};background:#2a2c31;color:#fff;border-radius:${u(2)};display:flex;align-items:center;justify-content:center;font-size:${u(6)}}
table{border-collapse:collapse;width:100%}
.tb th{background:var(--chip);font-weight:700;padding:${u(2.5)} ${u(2)};white-space:nowrap;position:sticky;top:${u(-3)}}
.tb td{border-top:${u(.5)} dashed var(--line);padding:${u(2.2)} ${u(2)};text-align:center;white-space:nowrap}
.tb td.nk{text-align:left;font-weight:700;line-height:1.25}.tb td.nk small{display:block;font-weight:400;color:var(--sub);font-size:.85em}
.tb td.ct{text-align:left;max-width:${u(90)};overflow:hidden;text-overflow:ellipsis}
.thumb{display:inline-block;background:#8b8e96;color:#fff;font-size:.85em;padding:${u(1)} ${u(3)};margin-right:${u(2)}}
.yt{color:#e5322d}
.blk{background:#e5322d;color:#fff;border-radius:${u(2)};padding:${u(1)} ${u(3)};font-size:.9em}
.blocked td{opacity:.35;text-decoration:line-through}
.bigb{display:flex;gap:${u(3)}}
.bigb button{flex:1;background:#33363d;color:#fff;border-radius:${u(2.5)};padding:${u(5)} 0;font-weight:700;white-space:nowrap}
.bigb button.on{background:var(--blue)}
.card{border:${u(.6)} solid var(--line);padding:${u(2)};margin-bottom:${u(3)};display:grid;grid-template-columns:1fr 1fr;gap:${u(1.5)};text-align:center}
.card .tp{color:#fff;font-weight:700;padding:${u(1.5)} 0}
.card .nm{font-weight:700;padding:${u(1.5)} 0}
.card .in{font-size:.92em;white-space:nowrap}
.card button{padding:${u(2)} 0;color:#fff;font-weight:700}
.card .ok{background:#55585f}.card .no{background:#b9bcc4}
.t-quest{background:#2d57b8}.t-lucky{background:#7d3cc8}.t-play{background:#3e9a3e}.t-video{background:#d04a4a}
.empty{color:var(--sub);text-align:center;padding:${u(10)} 0}
.vr{display:grid;grid-template-columns:${u(26)} 1fr ${u(16)};align-items:center;gap:${u(3)};margin:${u(3.2)} 0}
.vr b{font-weight:700}.vr em{font-style:normal;font-size:.85em;color:var(--sub);text-align:right}
input[type=range]{width:100%;height:${u(4)};accent-color:#4fb8e8;margin:0}
.master{background:#33363d;color:#fff;border-radius:${u(3)};padding:${u(4)} ${u(5)};display:flex;align-items:center;margin-bottom:${u(4)}}
.master small{display:block;font-size:.8em;opacity:.8;font-weight:400}
.master b{font-size:1.05em}
.tg{margin-left:auto;width:${u(15)};height:${u(8)};border-radius:${u(4)};background:#c7c9cf;position:relative;flex:none;cursor:pointer}
.tg::after{content:'';position:absolute;left:${u(1)};top:${u(1)};width:${u(6)};height:${u(6)};border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:#2e3036}.dark .tg.on{background:var(--blue)}.master .tg.on{background:#111}
.tg.on::after{left:${u(8)}}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:${u(3)}}
.tgrid button{background:#33363d;color:#fff;border-radius:${u(3)};padding:${u(3)} 0;display:flex;flex-direction:column;align-items:center;gap:${u(2)}}
.tgrid button.off{background:var(--off)}
.tgrid button i{width:${u(12)};height:${u(6)};border-radius:${u(3)};background:#fff;position:relative;font-style:normal}
.tgrid button i::after{content:'';position:absolute;top:${u(1)};left:${u(6.5)};width:${u(4)};height:${u(4)};border-radius:50%;background:#33363d}
.tgrid button.off i::after{left:${u(1.5)};background:var(--off)}
.row2{display:flex;align-items:center;padding:${u(3)} 0;border-bottom:${u(.5)} solid var(--line)}
.sel{border:${u(.6)} solid var(--line);background:var(--wb);border-radius:${u(1.5)};padding:${u(1.5)} ${u(3)};font-size:inherit}
.vbar{position:relative;border:${u(.6)} solid var(--line);margin:${u(2.5)} 0;padding:${u(2.5)} ${u(4)};cursor:pointer;overflow:hidden}
.vbar i{position:absolute;left:0;top:0;bottom:0;background:rgba(61,109,242,.18)}
.vbar span{position:relative}.vbar em{position:relative;float:right;font-style:normal;color:var(--sub)}
/* Dock */
#dock{left:50%;bottom:${u(6)};transform:translateX(-50%);height:${u(25)};background:#111;border-radius:${u(4)};display:flex;align-items:center;gap:${u(3)};padding:0 ${u(4)};z-index:40;transition:transform .3s ease,opacity .3s;border:${u(.8)} solid #444}
#dock.hide{transform:translate(-50%,${u(40)});opacity:0;pointer-events:none}
#dock .db{position:relative;width:${u(19)};height:${u(19)};border-radius:${u(3)};background:#80838b;color:#fff;font-size:${u(4.3)};line-height:1.15;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line;padding:0 ${u(.5)}}
#dock .db.on{background:#4a86e8}
#dock .db:hover{filter:brightness(1.15)}
#dock .ctl{background:#5d6068;font-size:${u(8)}}

#dock .ctl.off{color:#ff6b6b}
#dock .sep{width:${u(.6)};height:${u(13)};background:#888;margin:0 ${u(1.5)}}
#dock .bd{position:absolute;right:${u(-2.5)};top:${u(-2.5)};min-width:${u(7)};height:${u(7)};border-radius:${u(4)};background:#e5322d;font-size:${u(4.6)};font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 ${u(1.2)}}
#dockHot{left:0;right:0;bottom:0;height:${u(10)};z-index:39}
/* 인디케이터 */
#ind{left:0;top:0;width:100%;height:100%;z-index:200;pointer-events:none}
#ind .x{position:absolute;width:${u(44)};height:${u(44)};transform:translate(-50%,-50%);pointer-events:none}

#ind .ib.c::before{content:'';width:${u(7)};height:${u(7)};background:currentColor;border-radius:${u(1)}}
#ind .ib.u{left:${u(15)};top:0}#ind .ib.d{left:${u(15)};top:${u(30)}}#ind .ib.l{left:0;top:${u(15)}}#ind .ib.r{left:${u(30)};top:${u(15)}}#ind .ib.c{left:${u(15)};top:${u(15)}}

#addx{position:absolute;z-index:260;width:${u(9)};height:${u(9)};border-radius:50%;background:#e5322d;color:#fff;font-size:${u(5.5)};display:none;align-items:center;justify-content:center}
/* 모달·팝업 */
.ov{position:absolute;inset:0;z-index:100;display:none}
.ov.on{display:block}
.ov.dimbg{background:rgba(0,0,0,.35)}
#preset{position:absolute;right:${u(14)};top:${u(CY - 2)};bottom:${u(3)};width:${u(158)};background:#000;color:#fff;padding:${u(6)};display:flex;flex-direction:column;gap:${u(4)};font-size:${u(6.2)}}

#noti{position:absolute;right:${u(7)};top:${u(31)};width:${u(128)};max-height:${u(160)};background:var(--wb);border-radius:${u(4)};box-shadow:0 ${u(2)} ${u(12)} rgba(0,0,0,.35);display:flex;flex-direction:column;font-size:${u(5.2)}}

function applyTheme() { F.classList.toggle('dark', S.dark); F.style.setProperty('--fs', S.fs / 100); }

/* ---------------- 클릭 동작 ---------------- */
F.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');

    if (e.target.closest('#ov-preset') && !e.target.closest('#preset')) { closeAll(); return; }

    if (kind === 'update') BOOT.innerHTML = `<div class="bm" data-spec="35:1"><h4>버전이 업데이트 되었습니다.</h4><p>Toonation Remote V0.00.1</p><button class="ok" data-bact="install" data-spec="35:1">지금 설치</button></div>`;
    if (kind === 'expired') BOOT.innerHTML = `<div class="bm" data-spec="36:1"><h4>다시 로그인 해주세요.</h4><p>로그인 유지 시간이 만료되어 자동으로 로그아웃 되었습니다.</p><button class="ok" data-bact="relogin" data-spec="36:1">로그인</button></div>`;
  }
}
function hideBoot() { S.boot = null; BOOT.className = ''; BOOT.innerHTML = ''; }
function bootModal(h, p) { const m = document.createElement('div'); m.className = 'bm'; m.innerHTML = `<button class="x" data-bact="mx">✕</button><h4>${h}</h4><p>${p}</p><button class="ok" data-bact="mx">확인</button>`; BOOT.append(m); }
function afterLogin() {
  let skip = false; try { skip = localStorage.getItem('d2p.remote.adhide') === new Date().toISOString().slice(0, 10); } catch (_) {}
  if (skip) { hideBoot(); toast('로그인 완료 — 오늘 하루 열지 않음으로 광고 팝업은 건너뛰어요'); } else { showBoot('adpop'); toast('로그인 완료 — 관리자 배너시스템의 광고 팝업'); }
}
BOOT.addEventListener('click', (e) => {
  const a = e.target.closest('[data-bact]'); if (!a) return;
  e.stopPropagation();
  switch (a.dataset.bact) {
    case 'tologin': showBoot('login'); break;
    case 'login': {
      const id = BOOT.querySelector('#lid').value.trim(), pw = BOOT.querySelector('#lpw').value;
      if (pw !== '1234' || !id) { bootModal('로그인 실패', '아이디 또는 비밀번호가 일치하지 않습니다.'); break; }
      try { if (BOOT.querySelector('#lsave').checked) localStorage.setItem('d2p.remote.id', id); else localStorage.removeItem('d2p.remote.id'); } catch (_) {}
      if (BOOT.querySelector('#lkeep').checked) toast('로그인 상태 유지 — 리모컨을 종료해도 설정 기간 동안 로그인 유지');
      afterLogin(); break;
    }
    case 'link': toast('https://toon.at/streamer/login 으로 새 창 이동'); break;
    case 'sns': { const n = a.dataset.n; const m = document.createElement('div'); m.className = 'bm'; m.innerHTML = `<button class="x" data-bact="mx">✕</button><h4>${n} 로그인</h4><p>${n} OAuth 창 (모달)</p><div style="display:flex;gap:${u(4)};justify-content:center"><button class="ok" data-bact="snsok">로그인 성공</button><button class="ok" style="background:#888" data-bact="snsfail">로그인 실패</button></div>`; BOOT.append(m); break; }
    case 'snsok': afterLogin(); break;
    case 'snsfail': a.closest('.bm').remove(); bootModal('로그인 실패', '로그인에 실패했습니다.'); break;
    case 'mx': a.closest('.bm').remove(); break;
    case 'acc': S.acc = +a.dataset.i; showBoot('account'); break;
    case 'accgo': afterLogin(); break;
    case 'adprev': S.slide = (S.slide + AD_SLIDES.length - 1) % AD_SLIDES.length; showBoot('adpop'); break;
    case 'adnext': S.slide = (S.slide + 1) % AD_SLIDES.length; showBoot('adpop'); break;
    case 'adimg': toast('배너 링크로 새 창 이동'); break;
    case 'adclose': { const t = BOOT.querySelector('#adtoday').checked; if (t) try { localStorage.setItem('d2p.remote.adhide', new Date().toISOString().slice(0, 10)); } catch (_) {} hideBoot(); toast(t ? '오늘 하루 광고 팝업을 열지 않아요' : '광고 팝업 닫기'); break; }
    case 'mretry': a.textContent = '확인 중…'; setTimeout(() => { if (S.boot === 'maint') { hideBoot(); toast('점검이 끝나 리모컨을 다시 불러왔어요'); } }, 1200); break;
    case 'install': {
      BOOT.innerHTML = `<div class="bm"><h4>업데이트 파일을 다운 받는 중입니다.</h4><div class="bar"><i></i></div></div>`;
      let p = 0; const bar = () => BOOT.querySelector('.bar i');
      const t1 = setInterval(() => { p += 20; if (bar()) bar().style.width = p + '%'; if (p >= 100) { clearInterval(t1); BOOT.innerHTML = `<div class="inst"><div class="h">TOONA 설치<span>— ▢ ✕</span></div><div class="c">설치하고 있습니다. 잠시 기다려주십시오...<div class="bar"><i></i></div></div></div>`; let p2 = 0; const t2 = setInterval(() => { p2 += 25; const b = BOOT.querySelector('.bar i'); if (b) b.style.width = p2 + '%'; if (p2 >= 100) { clearInterval(t2); setTimeout(() => { hideBoot(); toast('설치 완료 — 새 버전으로 리모컨이 다시 실행됐어요'); }, 400); } }, 450); } }, 300);
      break;
    }
    case 'relogin': showBoot('login'); toast('로그아웃 후 로그인 화면으로 이동'); break;
  }
});
BOOT.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.closest('.login')) { const b = BOOT.querySelector('[data-bact="login"]'); b && b.click(); } });
BOOT.addEventListener('input', (e) => { if (e.target.classList.contains('f') && e.target.value.length >= 25) toast('25자까지 입력할 수 있어요'); });
const BOOTS = ['splash', 'login', 'account', 'adpop', 'maint', 'update', 'expired'];

/* ---------------- 초기 상태 ---------------- */
function applyState(st) {
  hideBoot();
  Object.keys(EL).forEach((k) => { EL[k].remove(); delete EL[k]; });
  Object.assign(S, {
    tree: LAYOUTS.default(), float: [], adding: null, main: { x: 0, y: 0 }, zc: 1, mainTop: 0, dragging: false, indMode: null,
    dockPin: true, dockHover: false, winPin: false, dark: false, fs: 100, lang: 'ko', blockBtn: true, keepVideo: true, blocked: new Set(),
    listTab: 0, quickTab: 0, paused: false, useAll: true, use: Object.fromEntries(USE.map((x) => [x, !USE_OFF.includes(x)])), al: { sound: true, tts: true, show: true },
    vAuto: true, vVoice: false, vols: [75, 40, 85, 70, 35, 85, 40], vote: [4, 2, 3], adOn: false, wall: 0,
    wait: [{ k: 1, t: 'quest', nick: '침착맨', cash: 3000 }, { k: 2, t: 'lucky', nick: '침착맨', cash: 3000 }, { k: 3, t: 'play', nick: '침착맨', cash: 3000 }, { k: 4, t: 'video', nick: '침착맨', cash: 3000 }], wk: 4,
    noti: NOTI.map((n, i) => ({ ...n, read: i >= 2 })), setTab: 0, capture: null, keys: [{ fn: '알림 일시 정지', key: 'Ctrl + Shift + P' }, { fn: '', key: '' }],
    presets: [{ id: 1, name: '토크 방송', tree: LAYOUTS.talk() }, { id: 2, name: '엑셀 방송', tree: LAYOUTS.excel() }], pid: 2, preset: null, dirty: false, editing: null,
  });
  F.style.setProperty('--cv', '');
  closeAll(); hideInd(); $('#addx').style.display = 'none';
  WIN.style.display = MODE === 'window' || st === 'magnet' ? 'none' : '';
  switch (st) {
    case 'initial': S.tree = LAYOUTS.initial(); break;
    case 'preset': S.preset = null; break;
    case 'dockoff': S.dockPin = false; break;
    case 'desktop': S.tree = removeId(S.tree, 'vol'); S.float = [{ id: 'vol', x: WW + 8, y: 6, w: 142, h: 150, pin: false, z: 2 }]; break;
    case 'magnet': S.tree = null; S.float = [
      { id: 'list', x: 8, y: 8, w: 330, h: 300, z: 2 }, { id: 'use', x: 338, y: 8, w: 140, h: 300, z: 3 },
      { id: 'wait', x: 478, y: 8, w: 132, h: 170, z: 4 }, { id: 'vol', x: 478, y: 178, w: 132, h: 130, z: 5 }, { id: 'quick', x: 620, y: 230, w: 116, h: 70, z: 6 }]; break;
    case 'window': S.tree = null; S.float = [{ id: 'vol', x: 18, y: 16, w: 200, h: 220, z: 2 }, { id: 'wait', x: 140, y: 110, w: 170, h: 210, z: 3 }]; break;
  }
  applyTheme(); render();
  switch (st) {
    case 'preset': openOv('preset'); break;
    case 'notice': openOv('noti'); break;
    case 'settings': S.setTab = 0; openOv('set'); break;
    case 'keys': S.setTab = 1; openOv('set'); break;
    case 'info': S.setTab = 2; openOv('set'); break;
    case 'add': startAdd('gacha'); break;
    case 'indicator': startAdd('gacha'); break;
    case 'resize': CV.classList.add('hl-sp'); setTimeout(() => CV.classList.remove('hl-sp'), 2600); break;
  }
  if (BOOTS.includes(st)) showBoot(st);
}
applyState(ST0);
if (q.has('inspect')) F.classList.add('inspect');
post({ type: 'ready' });
})();
</script>
