function fit() {

const vc = $('#video'), vx = vc.getContext('2d');
const mc = $('#mini canvas'), mx = mc.getContext('2d');

let frameT = 0;
// 목업과 같은 회색 화면 + 재생 중임을 알 수 있는 은은한 움직임
function drawFrame(ctx, w, hgt, t, hue, base = '#404040') {
  ctx.fillStyle = base; ctx.fillRect(0, 0, w, hgt);
  const x = w * (0.5 + 0.35 * Math.sin(t * 0.35)), y = hgt * (0.5 + 0.3 * Math.cos(t * 0.27));
  const g = ctx.createRadialGradient(x, y, 0, x, y, w * 0.45);
  g.addColorStop(0, `hsla(${hue},35%,70%,.10)`); g.addColorStop(1, 'hsla(0,0%,0%,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, hgt);
}
function filters() {
  const blur = { '360p': 0.9, '480p': 0.5, '720p': 0.15, '1080p': 0 }[S.res];
  vc.style.filter = `blur(${blur}px)` + (S.sharp ? ' contrast(1.25) saturate(1.2)' : '');
}
let last = performance.now();
function loop(now) {
  const dt = (now - last) / 1000; last = now;
  const live = S.mode === 'live';
  if (live) {
    cur().elapsed += dt;                           // 방송 시간은 계속 흐름
    if (!S.playing) S.behind += dt;                // 일시정지 중에는 실시간 시점에서 멀어짐
    if (S.playing && !S.buffering && !S.radio) frameT += dt;
  }
  if (live && !S.radio) drawFrame(vx, vc.width, vc.height, frameT, cur().hue);
  if (S.pip) drawFrame(mx, mc.width, mc.height, frameT, cur().hue, '#a6a6a6');
  renderTimes();
  // 컨트롤 자동 숨김 (마우스 오버 후 5초)
  const show = now < S.ctlUntil || S.menu || !S.playing;
  $('#player').classList.toggle('hide-ctl', !show);
  $('#player').classList.toggle('idle', !show && (S.theater || S.fullscreen));
  requestAnimationFrame(loop);
}

/* ---------------- 렌더 ---------------- */
function renderTimes() {
  const c = cur();
  const total = Math.max(c.elapsed, 1), pos = Math.max(0, total - S.behind);
  const pct = Math.min(100, (pos / total) * 100);
  $('#bar .fill').style.width = pct + '%'; $('#bar .knob').style.left = pct + '%';
  $('#livebtn').classList.toggle('behind', S.behind > 1);
  const timeTxt = S.mode === 'ended' ? `${hms(S.endedAt)} 방송 종료` : `${hms(c.elapsed)} 방송 중`;
  $('#stat').innerHTML = `<span data-spec="20:2">${fmtViewers(c.viewers)}명 시청 중</span> · <span data-spec="20:2">${timeTxt}</span>`;

}

  cl.toggle('fullscreen', S.fullscreen); cl.toggle('side', S.fullscreen && S.side);
  cl.toggle('radio', S.radio && S.mode === 'live'); cl.toggle('pip', S.pip && S.mode === 'live');
  cl.toggle('buffering', S.buffering && S.playing && S.mode === 'live');
  cl.toggle('lowlat', S.lowlat);
  ['offline', 'cut', 'ended', 'sanction', 'withdrawn'].forEach((m) => cl.toggle('st-' + m, S.mode === m));
  cl.toggle('vol-open', $('#volwrap').classList.contains('open'));
  const logo = $('#logo'); logo.className = 'abs ' + c.platform; logo.textContent = c.logo;
  $('#play').innerHTML = S.playing ? I.pause : I.play;
  $('#play').dataset.tip = S.playing ? '일시정지 (space/K)' : '재생 (space/K)';
  const muted = S.muted || S.volume === 0;
  $('#vol').innerHTML = muted ? I.mute : I.vol; $('#vol').dataset.tip = muted ? '음소거 해제 (M)' : '음소거 (M)';
  const vv = muted ? 0 : S.volume; $('#volbar .v').style.width = vv * 100 + '%'; $('#volbar .k').style.left = vv * 100 + '%';
  $('#res').innerHTML = S.res + ' ▾';
  $('#pipb').dataset.tip = S.pip ? 'PIP 모드 종료 (P)' : 'PIP 모드 (P)';
  $('#theb').innerHTML = S.theater ? I.theaterOff : I.theater; $('#theb').dataset.tip = S.theater ? '영화관 모드 종료 (T)' : '영화관 모드 (T)';
  $('#fsb').innerHTML = S.fullscreen ? I.fsOff : I.fs; $('#fsb').dataset.tip = S.fullscreen ? '전체 화면 종료 (F)' : '전체 화면 (F)';
  $('#chatb').dataset.tip = S.side ? '후원/채팅 닫기' : '후원/채팅';
  document.querySelectorAll('#resmenu .opt').forEach((o) => o.classList.toggle('on', o.dataset.res === S.res));
  $('#sharp').classList.toggle('on', S.sharp); $('#lowlatT').classList.toggle('on', S.lowlat); $('#radioT').classList.toggle('on', S.radio);
  $('#resmenu').classList.toggle('open', S.menu === 'res'); $('#setmenu').classList.toggle('open', S.menu === 'set');
  $('#title').textContent = c.title;
  $('#cats').innerHTML = c.cats.map((t, i) => `<div class="abs cat" data-spec="20:3" style="left:${u(15.8 + 56.5 * i)}">${t}</div>`).join('');
  $('#tags').style.left = u(15.8 + 56.5 * c.cats.length + 2);
  $('#tags').innerHTML = c.tags.map((t) => `<span>${t}</span>`).join('');
  $('#cname b').textContent = c.name; $('#cname .id').textContent = c.id; $('#verified').style.display = c.verified ? '' : 'none';
  $('#oneline').textContent = c.msg;
  $('#more').style.left = u(45.8 + Math.min(c.msg.length * 7.1, 160) + 4);
  $('#fav').innerHTML = I.star(S.fav) + '즐겨찾기'; $('#fav').classList.toggle('on', S.fav);
  $('#alarm').innerHTML = I.bell(S.alarm) + '알림'; $('#alarm').classList.toggle('on', S.alarm);
  document.querySelectorAll('#tabs button').forEach((b, i) => b.classList.toggle('on', i === S.tab));
  const chatOff = ['offline', 'ended', 'sanction'].includes(S.mode);
  if (chatOff && S.rtab === 1) S.rtab = 0;
  $('#rt-don').classList.toggle('on', S.rtab === 0); $('#rt-chat').classList.toggle('on', S.rtab === 1); $('#rt-chat').classList.toggle('dis', chatOff);
  $('#scontent').textContent = S.rtab === 0 ? '후원 메뉴별 컨텐츠 노출 영역\n(생략)' : '채팅 영역\n(채팅 구성안 참조)';
  document.querySelectorAll('#icons .ic').forEach((b, i) => b.classList.toggle('on', i === S.icon));
  $('#donate').innerHTML = `${c.name}<span>님에게</span> 후원하기`; $('#donate').classList.toggle('dis', S.mode === 'sanction');
  $('#dim').style.display = S.modal ? 'block' : 'none';
  $('#m-hires').style.display = S.modal === 'hires' ? 'block' : 'none';
  $('#m-profile').style.display = S.modal === 'profile' ? 'block' : 'none';
  $('#p-name').textContent = c.name; $('#p-id').textContent = c.id; $('#p-msg').textContent = '제 방송을 시청해주셔서 감사합니다.';
  $('#p-tags').innerHTML = ['#토크', '#음악/댄스', '#여행/야외방송'].map((t) => `<span>${t}</span>`).join('');
  filters();
}

/* ---------------- 동작 ---------------- */
function poke() { S.ctlUntil = performance.now() + 5000; }   // 1번: 마우스 오버 시 5초 동안 기능 표시
function setPlaying(p) {
  if (S.mode !== 'live') return;
  if (p && !S.playing) S.behind = 0;    // 1-4: 일시정지 → 재생 시 실시간 시점으로
  S.playing = p; render();
}
function switchStream(d) {               // 1-2: 이전/다음 방송 (관리자 노출순위)
  S.si = (S.si + d + STREAMS.length) % STREAMS.length;
  S.behind = 0; S.playing = true; S.mode = 'live'; S.buffering = false; S.radio = false;
  toast(`${d > 0 ? '다음' : '이전'} 방송: ${cur().name} (${cur().logo})`); render();
}
function setPip(on) {
  if (S.fullscreen && on) return;         // 15p: 전체 화면에서는 PIP 미제공
  S.pip = on; render();                   // 14p 2번: 영화관 모드 상태는 그대로 유지 → 종료 시 영화관 모드로 복귀
}
function setTheater(on) { if (S.fullscreen) return; S.theater = on; render(); }
function setFull(on) { S.fullscreen = on; if (!on) S.side = false; if (on) S.pip = false; S.menu = null; render(); }   // 14p 3번: 종료 시 영화관 모드 상태로 복귀
function chooseRes(r) {
  S.menu = null;
  if (r === '720p' || r === '1080p') { S.modal = 'hires'; S.pendingRes = r; render(); return; }   // 1-7 → 2번 모달
  S.res = r; render(); toast(`해상도 ${r}`);
}
function startBuffer(sec = 2.6) {
  if (S.mode !== 'live' || S.radio) return;
  if (!S.playing) { toast('일시정지 상태에서는 버퍼링을 표시하지 않아요 (17p)'); return; }
  S.buffering = true; render();
  clearTimeout(S._bt); S._bt = setTimeout(() => { S.buffering = false; render(); }, sec * 1000);   // 버퍼 회복 시 이어서 재생
}
function setMode(m) {
  S.mode = m; S.menu = null; S.modal = null;
  if (m === 'cut') S.cutAt = Date.now();
  if (m === 'ended') { S.endedAt = cur().elapsed; S.pip = false; S.fullscreen = false; S.theater = false; }
  if (m !== 'live') { S.buffering = false; }
  if (m === 'live') { S.playing = true; S.behind = 0; }
  render();
}

/* 클릭 위임 */
F.addEventListener('click', (e) => {
  const t = e.target;
  const ACT = /^(play|vol|livebtn|res|set|sharp|lowlatT|radioT|radiooff|pipb|pipoff|minipipoff|miniclose|mplay|theb|fsb|chatb|prev|next|hi-install|hi-skip|more|pclose|dim|pcta|fav|alarm|share|gohome|wback|rt-don|rt-chat|donate|fold)$/;
  let a = t; while (a && a !== F && !(a.id && ACT.test(a.id))) a = a.parentElement;
  const id = a && a !== F ? a.id : '';
  // 메뉴 바깥 클릭 시 닫힘 (1-7, 1-8)
  if (S.menu && !t.closest('.menu') && id !== 'res' && id !== 'set') { S.menu = null; render(); }
  const opt = t.closest('#resmenu .opt'); if (opt) return chooseRes(opt.dataset.res);
  const tab = t.closest('#tabs button'); if (tab) { S.tab = +tab.dataset.tab; return render(); }
  const ic = t.closest('#icons .ic'); if (ic) { S.icon = +ic.dataset.ic; return render(); }
  switch (id) {
    case 'play': return setPlaying(!S.playing);
    case 'vol': S.muted = !(S.muted || S.volume === 0); if (!S.muted && S.volume === 0) S.volume = 0.5; return render();
    case 'livebtn': S.behind = 0; S.playing = true; toast('실시간 시점으로 이동'); return render();
    case 'res': S.menu = S.menu === 'res' ? null : 'res'; return render();
    case 'set': S.menu = S.menu === 'set' ? null : 'set'; return render();
    case 'sharp': S.sharp = !S.sharp; toast(`선명한 화면 ${S.sharp ? 'ON' : 'OFF'}`); return render();
    case 'lowlatT': S.lowlat = !S.lowlat; toast(S.lowlat ? '저지연 모드 ON — 방송과 거의 동시에 시청' : '저지연 모드 OFF'); return render();
    case 'radioT': S.radio = !S.radio; S.menu = null; return render();
    case 'radiooff': S.radio = false; return render();
    case 'pipb': return setPip(!S.pip);
    case 'pipoff': case 'minipipoff': return setPip(false);
    case 'miniclose': return setPip(false);   // 13p 2번 ①: 해당 후원페이지에서는 PIP 종료
    case 'mplay': return setPlaying(!S.playing);
    case 'theb': return setTheater(!S.theater);
    case 'fsb': return setFull(!S.fullscreen);
    case 'chatb': S.side = !S.side; return render();
    case 'prev': return switchStream(-1);
    case 'next': return switchStream(1);
    case 'hi-install': S.modal = null; toast('확장 프로그램 설치 페이지로 이동합니다 (프로토타입)'); return render();
    case 'hi-skip': S.modal = null; return render();    // 기존 해상도 유지
    case 'more': S.modal = 'profile'; return render();
    case 'pclose': case 'dim': S.modal = null; return render();
    case 'pcta': S.modal = null; return render();
    case 'fav': S.fav = !S.fav; toast(S.fav ? '즐겨찾기에 추가했어요' : '즐겨찾기를 해제했어요'); return render();
    case 'alarm': S.alarm = !S.alarm; toast(S.alarm ? '방송 알림을 받아요' : '방송 알림을 받지 않아요'); return render();
    case 'share': try { navigator.clipboard && navigator.clipboard.writeText('https://toon.at/donate/' + cur().id.replace('#', '')); } catch (_) {} toast('후원페이지 URL이 복사되었습니다'); return;
    case 'gohome': case 'wback': toast('홈으로 이동'); return;
    case 'rt-don': S.rtab = 0; return render();
    case 'rt-chat':
      if ($('#rt-chat').classList.contains('dis')) { toast(S.mode === 'offline' ? '오프라인 상태에서는 채팅할 수 없어요 (후원만 가능)' : S.mode === 'ended' ? '방송 종료 시점부터 채팅이 불가해요' : '운영자 제재로 후원 및 채팅이 불가해요'); return; }
      S.rtab = 1; return render();
    case 'donate': if (S.mode === 'sanction') { toast('운영자 제재로 후원 및 채팅이 불가해요'); return; } toast('후원하기 (프로토타입)'); return;
    case 'fold': toast('패널 접기 (기획 범위 밖)'); return;
  }
});
// 볼륨: 아이콘 마우스 오버 시 볼륨 바 표시, 드래그 조절, 0% = 음소거
const vw = $('#volwrap');
vw.addEventListener('mouseenter', () => { vw.classList.add('open'); render(); });
vw.addEventListener('mouseleave', () => { vw.classList.remove('open'); render(); });
function drag(el, fn) {
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation(); el.setPointerCapture(e.pointerId);
    const mv = (ev) => { const r = el.getBoundingClientRect(); fn(Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)), ev, false); };
    mv(e);
    const up = (ev) => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); fn(null, ev, true); };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
  });
}
drag($('#volbar'), (x) => { if (x == null) return; S.volume = Math.round(x * 100) / 100; S.muted = S.volume === 0; render(); });
// 플레이 바: 클릭/드래그로 특정 시점 이동 + 썸네일 미리보기 (10p)
const bar = $('#bar'), pv = $('#preview');
function showPreview(x) {
  const c = cur(), t = x * c.elapsed;
  const r = bar.getBoundingClientRect(), pr = $('#player').getBoundingClientRect();
  pv.style.display = 'flex'; pv.style.left = (r.left - pr.left + x * r.width) + 'px';
  pv.querySelector('.t').textContent = mmss(t);

}
bar.addEventListener('mousemove', (e) => { const r = bar.getBoundingClientRect(); showPreview(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width))); });
bar.addEventListener('mouseleave', () => { pv.style.display = 'none'; });
drag(bar, (x, e, end) => {
  if (x != null) { S.behind = (1 - x) * cur().elapsed; if (S.behind < 2) S.behind = 0; showPreview(x); render(); }
  if (end) { pv.style.display = 'none'; frameT += 0.5; }
});
// PIP 창: 드래그 이동 가능, 크기 조절 불가
(() => {
  const m = $('#mini'); let sx, sy, ox, oy, on = false;
  m.addEventListener('pointerdown', (e) => { if (e.target.closest('#miniclose,#minipipoff,#mplay')) return; on = true; m.setPointerCapture(e.pointerId); sx = e.clientX; sy = e.clientY; ox = m.offsetLeft; oy = m.offsetTop; });
  m.addEventListener('pointermove', (e) => {
    if (!on) return;
    const k = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'));
    const nx = Math.min(FW * k - m.offsetWidth, Math.max(0, ox + e.clientX - sx)), ny = Math.min(FH * k - m.offsetHeight, Math.max(0, oy + e.clientY - sy));
    m.style.left = nx + 'px'; m.style.top = ny + 'px';
  });
  m.addEventListener('pointerup', () => { on = false; });
})();
$('#player').addEventListener('mousemove', poke);
$('#player').addEventListener('mouseenter', poke);
// 단축키: space/K 재생·일시정지, M 음소거, P PIP, T 영화관, F 전체 화면, ESC 전체 화면 종료
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'k') { e.preventDefault(); setPlaying(!S.playing); poke(); }
  else if (k === 'm') { S.muted = !(S.muted || S.volume === 0); render(); }
  else if (k === 'p') setPip(!S.pip);
  else if (k === 't') setTheater(!S.theater);
  else if (k === 'f') setFull(!S.fullscreen);
  else if (k === 'escape') { if (S.modal) { S.modal = null; render(); } else if (S.menu) { S.menu = null; render(); } else if (S.fullscreen) setFull(false); }
});
// 시청자 수: 서버 기준 5~10초 주기 갱신. 송출 끊김 중에는 마지막 값 유지
(function tick() {
  if (S.mode === 'live') { const c = cur(); c.viewers = Math.max(0, Math.round(c.viewers * (1 + (Math.random() - 0.5) * 0.04))); }
  setTimeout(tick, 5000 + Math.random() * 5000);
})();

/* ---------------- 기획서 연결 (부모 뷰어와 postMessage) ---------------- */
const post = (m) => { try { parent.postMessage(Object.assign({ d2p: true }, m), '*'); } catch (_) {} };
F.addEventListener('click', (e) => {
  const el = e.target.closest('[data-spec]'); if (!el) return;
  post({ type: 'spec', refs: el.dataset.spec.split(/\s+/), label: (el.dataset.tip || el.textContent || '').trim().slice(0, 30) });
}, true);
F.addEventListener('mouseover', (e) => {
  if (!F.classList.contains('inspect')) return;
  const el = e.target.closest('[data-spec]'), chip = $('#chip');
  if (!el) { chip.style.display = 'none'; return; }
  const r = el.getBoundingClientRect();
  chip.textContent = el.dataset.spec.split(/\s+/).map((x) => x.replace(':', 'p ')).join(' · ');
  chip.style.display = 'block'; chip.style.left = r.left + 'px'; chip.style.top = Math.max(0, r.top - 14) + 'px';
});
addEventListener('message', (e) => {
  const m = e.data; if (!m || !m.d2p) return;
  if (m.type === 'focus') {
    const els = [...F.querySelectorAll('[data-spec]')].filter((x) => x.dataset.spec.split(/\s+/).includes(m.ref) && x.offsetParent !== null);
    els.forEach((x) => { x.classList.remove('spec-flash'); void x.offsetWidth; x.classList.add('spec-flash'); setTimeout(() => x.classList.remove('spec-flash'), 3200); });
    post({ type: 'focused', ref: m.ref, count: els.length });
  } else if (m.type === 'inspect') F.classList.toggle('inspect', !!m.on);
  else if (m.type === 'event') runEvent(m.name, m.value);
  else if (m.type === 'state') applyState(m.state);
});
function runEvent(name, value) {
  switch (name) {
    case 'buffer': return startBuffer();
    case 'cut': return setMode('cut');
    case 'resume': setMode('live'); cur().viewers = Math.round(cur().viewers * 1.02); toast('방송이 재송출되었어요 — 시청자 수 즉시 갱신'); return render();
    case 'end': return setMode('ended');
    case 'live': S.viewersFail = false; return setMode('live');
    case 'offline': return setMode('offline');
    case 'sanction': return setMode('sanction');
    case 'withdrawn': return setMode('withdrawn');
    case 'viewers': if (value === 'fail') S.viewersFail = true; else { S.viewersFail = false; cur().viewers = +value; } return render();
  }
}

/* ---------------- 초기 상태 (?state=) ---------------- */
function applyState(stName) {
  Object.assign(S, { mode: 'live', playing: true, buffering: false, behind: 0, radio: false, pip: false, theater: false, fullscreen: false, side: false, menu: null, modal: null });
  switch (stName) {
    case 'offline': S.mode = 'offline'; break;
    case 'controls': poke(); S.ctlUntil = performance.now() + 8000; break;
    case 'menu-res': S.menu = 'res'; break;
    case 'menu-set': S.menu = 'set'; break;
    case 'hires': S.modal = 'hires'; break;
    case 'seek': S.behind = cur().elapsed * 0.35; break;
    case 'radio': S.radio = true; break;
    case 'pip': S.pip = true; break;
    case 'theater': S.theater = true; break;
    case 'fullscreen': S.fullscreen = true; break;
    case 'fullscreen-side': S.fullscreen = true; S.side = true; break;
    case 'buffer': setTimeout(() => startBuffer(4), 300); break;
    case 'cut': S.mode = 'cut'; S.cutAt = Date.now() - 15000; break;
    case 'ended': S.mode = 'ended'; S.endedAt = cur().elapsed; break;
    case 'profile': S.modal = 'profile'; break;
    case 'sanction': S.mode = 'sanction'; break;
    case 'withdrawn': S.mode = 'withdrawn'; break;
  }
  S.ctlUntil = performance.now() + 5000;
  render();
}
applyState(q.get('state') || 'live');
if (q.has('inspect')) F.classList.add('inspect');
requestAnimationFrame(loop);
post({ type: 'ready' });
})();
</script>
