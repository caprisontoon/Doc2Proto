  <button class="ico" id="pop" title="채팅 팝업" data-spec="33:채널 영역"><svg viewBox="0 0 16 16" width="80%"><rect x="1.5" y="3.5" width="9" height="11" rx="1.2" fill="none" stroke="#555" stroke-width="1.3"/><path d="M7 1.5h7.5V9" fill="none" stroke="#555" stroke-width="1.3"/><path d="M9 7l5-5" stroke="#3d4fe0" stroke-width="1.5"/></svg></button>

<div id="ac" class="abs"></div>

<div id="inbar" class="abs" data-spec="29:채팅 39:텍스트 전송">

<div class="sheet" id="sh-report" data-spec="38:신고"></div>
<div id="prof" class="abs" data-spec="29:채팅 38:신고 38:차단"></div>
<div id="popped" class="abs" data-spec="33:채널 영역"><div class="w"></div><b>채팅이 팝업으로 분리되었습니다</b><span>오른쪽 플로팅 창에서 계속 채팅할 수 있어요</span><button id="unpop">채팅 되돌리기</button></div>
<div id="toast"></div><div id="chip"></div>`;
const $ = (s) => F.querySelector(s);
const $$ = (s) => [...F.querySelectorAll(s)];
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
function fit() { const k = EMBED || POPUP ? Math.min(innerWidth / FW, innerHeight / FH) : Math.min(innerWidth / FW, (innerHeight - 8) / FH); document.documentElement.style.setProperty('--u', k + 'px'); }
addEventListener('resize', fit); fit();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const won = (n) => n.toLocaleString('en-US');

/* ---------------- 클린봇 판정 (32p) ---------------- */
function judge(m) {
  if (m.kind !== 'chat' || !m.user) return null;
  const norm = (t) => t.replace(/\s+/g, '').replace(/(.)\1{2,}/g, '$1$1').toLowerCase();
  const hits = [];
  if (BAD.some((w) => m.text.includes(w))) hits.push([100, '욕설/비속어']);
  const same = S.msgs.filter((x) => x.kind === 'chat' && x.user && x.user.nick === m.user.nick && x.id !== m.id && m.at - x.at <= 8000 && m.at >= x.at && norm(x.text) === norm(m.text));
  if (same.length >= 1) hits.push([60, '도배']);
  const burst = S.msgs.filter((x) => x.kind === 'chat' && x.user && x.user.nick === m.user.nick && m.at - x.at <= 3000 && m.at >= x.at);
  if (burst.length >= 4) hits.push([50, '도배']);
  if (/(https?:\/\/|www\.|카톡|텔레|010-?\d{3,4})/i.test(m.text)) hits.push([40, '광고/연락처']);
  if (!hits.length) return null;
  hits.sort((a, b) => b[0] - a[0]);
  return { score: hits[0][0], reason: hits[0][1] };
}
const blinded = (m) => S.clean && m.judge && m.judge.score >= TH[S.strength] && !S.revealed.has(m.id);

/* ---------------- 메시지 ---------------- */
function push(m) {
  m.id = S.id++; m.at = m.at || Date.now(); m.ch = m.ch || S.ch;
  if (m.kind === 'chat') m.judge = judge(m);
  S.msgs.push(m);
  if (S.msgs.length > 400) S.msgs.shift();
  if (m.ch === S.ch) appendLine(m);
  renderTabs();
  return m;
}
function body(t) {
  let h = esc(t);
  h = h.replace(/:([a-z]+):/g, (all, k) => (STK[k] ? `<span class="stk" title=":${k}:">${STK[k]}</span>` : all));
  h = h.replace(/@([\w가-힣]+)/g, '<span class="mn">@$1</span>');
  return h;
}
function lineHTML(m) {
  const meNick = me() && me().nick;
  if (m.kind === 'enter') return `<div class="enter${S.enter ? '' : ' hide'}" data-spec="31:입장표시">🔔 ${esc(m.user.nick)} 님이 입장하였습니다</div>`;
  if (m.kind === 'sys') return `<div class="sys" data-spec="35:시작">${esc(m.text)}</div>`;
  const hidden = m.user && S.blocked.has(m.user.nick) ? ' hide' : '';
  const nick = `<span class="nk ${m.user.badge}" data-nick="${esc(m.user.nick)}" data-mid="${m.id}">${esc(m.user.nick)}</span>`;
  const bd = m.mine ? '' : `<span class="bd ${m.user.badge}">${m.user.badge === 'CR' ? '크리에이터' : m.user.badge}</span>`;
  if (m.kind === 'donate') {
    const tier = m.amount >= 100000 ? 4 : m.amount >= 50000 ? 3 : m.amount >= 10000 ? 2 : 1;
    return `<div class="dn t${tier}c${hidden}" data-spec="29:채팅" title="후원 금액 구간 ${['', '~9,999', '10,000~49,999', '50,000~99,999', '100,000~'][tier]} 캐시 색상" data-mid="${m.id}" data-tier="${tier}">
      <div class="t1">${bd}${nick}</div><div class="am">${won(m.amount)} 캐시</div><div class="t2"><b>${m.type || '텍스트후원'}</b>${body(m.text)}</div></div>`;
  }
  const bl = blinded(m);
  const ment = meNick && !m.mine && m.text.includes('@' + meNick);
  const cls = ['ln', m.mine ? 'mine' : '', ment ? 'ment' : '', m.deleted ? 'del' : '', bl ? 'blind' : ''].filter(Boolean).join(' ');
  const spec = bl ? '36:블라인드 표시' : m.deleted ? '36:삭제 / 차단 표시' : ment ? '36:멘션 하이라이트' : '36:메시지 라인 구성';
  const tx = bl ? `클린봇이 가린 메시지 (${m.judge.reason})` : body(m.text);
  return `<div class="${cls}${hidden}" data-mid="${m.id}" data-spec="${spec}">${m.mine ? `<span class="nk mine">나</span>` : bd + nick}<span class="tx">${tx}</span>${bl ? `<button class="see" data-see="${m.id}">보기</button>` : ''}</div>`;
}
function appendLine(m) {
  const L = $('#list'); const wasBottom = S.atBottom;
  L.insertAdjacentHTML('beforeend', lineHTML(m));
  if (wasBottom) L.scrollTop = L.scrollHeight;
  else if ((m.kind === 'chat' || m.kind === 'donate') && !S.blocked.has(m.user.nick)) { S.unread++; renderPeek(m); }
  if (m.kind === 'donate') renderRecent();
}
function renderList() {
  const L = $('#list'); const keep = S.atBottom ? null : L.scrollTop;
  L.innerHTML = S.msgs.filter((m) => m.ch === S.ch).map(lineHTML).join('');
  if (keep == null) L.scrollTop = L.scrollHeight; else L.scrollTop = keep;
  renderRecent();
}
function renderTabs() {
  $$('#tabs .tb').forEach((b) => {
    b.classList.toggle('on', b.dataset.ch === S.ch);
    const n = S.msgs.filter((m) => m.ch === b.dataset.ch && m.kind !== 'enter' && m.kind !== 'sys').length;
    b.querySelector('.c').textContent = Math.min(999, n + { toon: 840, yt: 312, tw: 527 }[b.dataset.ch]);   // 현재 채팅 숫자
  });
}
function renderPeek(m) {
  const p = $('#peek');
  if (S.atBottom) { p.classList.remove('on'); return; }
  const ok = (x) => x && (x.kind === 'chat' || x.kind === 'donate') && x.user;
  const last = ok(m) ? m : [...S.msgs].reverse().find((x) => x.ch === S.ch && (x.kind === 'chat' || x.kind === 'donate') && !(x.user && S.blocked.has(x.user.nick)));
  if (last) p.querySelector('.pt').innerHTML = last.mine ? `<b style="color:#3d4fe0">나</b> ${body(last.text)}` : `<b class="nk ${last.user.badge}" style="margin-right:3px">${esc(last.user.nick)}</b>${blinded(last) ? '<i style="color:#999">클린봇이 가린 메시지</i>' : body(last.text)}`;
  p.querySelector('.n').textContent = S.unread ? `+${S.unread}` : '';
  p.querySelector('.n').style.display = S.unread ? '' : 'none';
  p.classList.add('on');
}
function renderRecent() {
  const r = $('#recent'), d = [...S.msgs].reverse().find((x) => x.ch === S.ch && x.kind === 'donate');
  const on = !S.atBottom && d && !S.poll;
  r.classList.toggle('on', !!on);
  if (on) r.innerHTML = `💰 최근 후원 <b>${esc(d.user.nick)}</b> ${won(d.amount)} 캐시 — ${esc(d.text).slice(0, 18)}`;
}
$('#list').addEventListener('scroll', () => {
  const L = $('#list'); const bottom = L.scrollHeight - L.scrollTop - L.clientHeight < 6;
  if (bottom !== S.atBottom) { S.atBottom = bottom; if (bottom) S.unread = 0; renderPeek(); renderRecent(); }
});
function toBottom() { S.atBottom = true; S.unread = 0; const L = $('#list'); L.scrollTop = L.scrollHeight; renderPeek(); renderRecent(); }
$('#peek').addEventListener('click', toBottom);   // 38p 최신 복귀

/* ---------------- 공지 (34p) ---------------- */
function renderNotice() {
  const n = $('#notice');
  if (S.noticeEdit) {
    n.innerHTML = `<span class="mg">📢</span><input id="ntxt" maxlength="120" placeholder="공지 내용을 입력하세요" value="${esc(S.notice || '')}"><button class="b1" id="nok">등록</button><button class="b2" id="nno">취소</button>`;
    const i = $('#ntxt'); i.focus(); i.setSelectionRange(i.value.length, i.value.length);
    i.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) saveNotice(); if (e.key === 'Escape') { S.noticeEdit = false; renderNotice(); } });
    return;
  }
  n.innerHTML = S.notice
    ? `<span class="mg">📢</span><span class="tx"><b>공지</b>${esc(S.notice)}</span><button class="ed" id="ned" title="수정">✏️</button><button class="rm" id="nrm" title="삭제">✕</button>`
    : `<span class="mg">📢</span><button class="add" id="nadd">＋ 공지 등록</button><span class="tx"></span>`;
}
function saveNotice() {
  const v = $('#ntxt').value.trim();
  if (!v) { toast('공지 내용을 입력해 주세요'); return; }
  S.notice = v; S.noticeEdit = false; renderNotice(); toast('공지를 등록했어요 — 모든 채널에 공통 적용');
}
$('#notice').addEventListener('click', (e) => {
  const id = e.target.closest('button') && e.target.closest('button').id;
  if (id === 'ned' || id === 'nadd') { S.noticeEdit = true; renderNotice(); }
  else if (id === 'nrm') { S.notice = ''; renderNotice(); toast('공지를 내렸어요'); }
  else if (id === 'nok') saveNotice();
  else if (id === 'nno') { S.noticeEdit = false; renderNotice(); }
});

/* ---------------- 설정 시트 (30·31p) ---------------- */
const CREATOR_ONLY = ['strength', 'slow', 'freeze', 'poll', 'pred'];
function renderSettings() {
  const cr = S.role === 'creator';
  const dis = (k) => (!cr && CREATOR_ONLY.includes(k) ? 'disabled title="크리에이터만 설정할 수 있어요"' : '');
  $('#sh-set').innerHTML = `<div class="sh">설정<button data-close>✕</button></div><div class="sb">
    <div class="gl">노출 설정</div>
    <div class="srow"><button class="pill ${S.clean ? 'on' : ''}" data-t="clean" data-spec="31:클린봇">클린봇</button><select class="sel" id="str" ${dis('strength')} data-spec="31:클린봇 강도 32:강도">${['low:약', 'mid:중', 'high:강'].map((x) => { const [k, v] = x.split(':'); return `<option value="${k}" ${S.strength === k ? 'selected' : ''}>${v}</option>`; }).join('')}</select></div>
    <div class="srow"><button class="pill ${S.slow ? 'on' : ''}" data-t="slow" ${dis('slow')} data-spec="31:채팅입력제한">채팅입력제한</button><select class="sel" id="slowsec" ${dis('slow')} data-spec="31:채팅입력제한">${[5, 10, 30, 60].map((s) => `<option ${S.slowSec === s ? 'selected' : ''}>${s}초</option>`).join('')}</select></div>
    <div class="srow"><button class="pill ${S.freeze ? 'on' : ''}" data-t="freeze" ${dis('freeze')} style="flex:none;width:calc(100% - ${u(55)})" data-spec="31:채팅 얼리기">채팅 얼리기</button></div>
    <div class="srow"><button class="pill ${S.enter ? 'on' : ''}" data-t="enter" data-spec="31:입장표시">입장 표시</button><button class="pill ${S.big ? 'on' : ''}" data-t="big" data-spec="31:글자 크게">글자 크게</button></div>
    <div class="gl">차단 설정</div>
    <div class="srow"><button class="pill" data-open="block" style="flex:none;width:calc(100% - ${u(55)})" data-spec="31:차단 목록 38:차단">차단 목록 (${S.blocked.size})</button></div>
    <div class="gl">부가 기능</div>
    <div class="srow"><button class="pill on" data-open="poll" ${dis('poll')} data-spec="31:부가 기능 35:편집 창">투표 만들기</button><button class="pill on" data-open="pred" ${dis('pred')} data-spec="31:부가 기능 35:편집 창">승부 예측</button></div>
    ${cr ? '' : '<div class="fl">채팅입력제한·얼리기·클린봇 강도·부가 기능은 크리에이터만 바꿀 수 있어요</div>'}
  </div>`;
}
function openSheet(id) { S.sheet = id; $$('.sheet').forEach((s) => s.classList.toggle('on', s.id === 'sh-' + id)); $('#prof').classList.remove('on'); $('#emopan').classList.remove('on'); }
const closeSheets = () => { S.sheet = null; $$('.sheet').forEach((s) => s.classList.remove('on')); };
$('#more').addEventListener('click', () => { if (S.sheet === 'set') return closeSheets(); renderSettings(); openSheet('set'); });
$('#sh-set').addEventListener('click', (e) => {
  const t = e.target.closest('[data-t]'), o = e.target.closest('[data-open]');
  if (e.target.closest('[data-close]')) return closeSheets();
  if (t && !t.disabled) {
    const k = t.dataset.t; S[k] = !S[k];
    const msg = { clean: S.clean ? '클린봇 ON — 판정된 메시지를 가려요' : '클린봇 OFF — 판정 대상도 원문 그대로 보여요', slow: S.slow ? `채팅입력제한 ON — 보낸 뒤 ${S.slowSec}초 동안 입력 잠금 (크리에이터 제외)` : '채팅입력제한 OFF', freeze: S.freeze ? '채팅을 얼렸어요 — 도네이터 입력 제한' : '채팅 얼리기를 풀었어요', enter: S.enter ? '입장 알림을 표시해요' : '입장 알림을 숨겨요', big: S.big ? '글자를 크게 보여요' : '기본 글자 크기' }[k];
    if (k === 'freeze' || k === 'slow') push({ kind: 'sys', text: k === 'freeze' ? (S.freeze ? '❄ 크리에이터가 채팅을 얼렸습니다' : '채팅 얼리기가 해제되었습니다') : (S.slow ? `⏳ 저속 모드 ${S.slowSec}초가 켜졌습니다` : '저속 모드가 꺼졌습니다') });
    toast(msg); applyView(); renderSettings();
  }
  if (o && !o.disabled) { if (o.dataset.open === 'block') { renderBlock(); openSheet('block'); } else { openEditor(o.dataset.open); } }
});
$('#sh-set').addEventListener('change', (e) => {
  if (e.target.id === 'str') { S.strength = e.target.value; toast(`클린봇 강도: ${{ low: '약 (확정 욕설·강한 도배만)', mid: '중 (반복 도배까지)', high: '강 (광고·의심까지)' }[S.strength]}`); renderList(); }
  if (e.target.id === 'slowsec') { S.slowSec = parseInt(e.target.value, 10); toast(`전송 간격 ${S.slowSec}초`); }
});
function applyView() { F.classList.toggle('big', S.big); renderList(); renderInput(); }

/* ---------------- 차단 목록 / 프로필 / 신고 (38p) ---------------- */
function renderBlock() {
  const list = [...S.blocked];
  $('#sh-block').innerHTML = `<div class="sh">차단 목록<button data-close>✕</button></div><div class="sb">
    ${list.length ? list.map((n) => { const us = USERS.find((x) => x.nick === n) || { badge: 'FR' }; return `<div class="bl"><span class="bd ${us.badge}">${us.badge}</span><span>${esc(n)}</span><button data-unb="${esc(n)}">차단 해제</button></div>`; }).join('') : '<div class="fl" style="text-align:center;margin:14px 0">차단한 유저가 없어요</div>'}
    <div class="bt2"><button data-close>닫기</button></div></div>`;
}
$('#sh-block').addEventListener('click', (e) => {
  if (e.target.closest('[data-close]')) return closeSheets();
  const b = e.target.closest('[data-unb]');
  if (b) { S.blocked.delete(b.dataset.unb); toast(`${b.dataset.unb} 님 차단을 해제했어요 — 메시지가 다시 보여요`); renderBlock(); renderList(); }
});
$('#list').addEventListener('click', (e) => {
  const see = e.target.closest('[data-see]');
  if (see) { S.revealed.add(+see.dataset.see); renderList(); return; }
  const n = e.target.closest('.nk[data-nick]'); if (!n) return;
  const m = S.msgs.find((x) => x.id === +n.dataset.mid);
  S.prof = { nick: n.dataset.nick, badge: m.user.badge, mid: m.id };
  const p = $('#prof'); const r = n.getBoundingClientRect(), fr = F.getBoundingClientRect(), k = fr.width / FW;
  p.innerHTML = `<div class="top"><div class="av"></div><span class="bd ${m.user.badge}">${m.user.badge === 'CR' ? '크리에이터' : m.user.badge}</span><span class="nk ${m.user.badge}">${esc(S.prof.nick)}</span><button data-close>✕</button></div>
    <div class="acts"><button class="bk">🚫 차단</button><button class="rp">🚩 신고</button><button class="dl">🗑 삭제</button></div>`;
  p.style.top = u(Math.min((r.bottom - fr.top) / k + 4, FH - 90));
  p.classList.add('on'); closeSheets();
});
$('#prof').addEventListener('click', (e) => {
  const p = $('#prof'); const P = S.prof;
  if (e.target.closest('[data-close]')) { p.classList.remove('on'); return; }
  if (e.target.closest('.bk')) {
    if (me() && P.nick === me().nick) { toast('나는 차단할 수 없어요'); return; }
    S.blocked.add(P.nick); p.classList.remove('on'); renderList(); toast(`${P.nick} 님을 차단했어요 — 이 유저의 메시지가 숨겨져요`);
  }
  if (e.target.closest('.rp')) { p.classList.remove('on'); openReport(P); }
  if (e.target.closest('.dl')) { const m = S.msgs.find((x) => x.id === P.mid); if (m) m.deleted = true; p.classList.remove('on'); renderList(); toast('매니저 권한으로 메시지를 삭제했어요'); }
});
function openReport(P) {

    case 'popout': S.popped = true; $('#popped').classList.add('on'); break;
    case 'notice': S.noticeEdit = true; renderNotice(); break;
    case 'poll': startPoll('poll', '점심 뭐 먹을까?', ['치킨', '피자', '국밥']); S.poll.items[0].n = 4; S.poll.items[1].n = 2; S.poll.items[2].n = 3; renderPoll(); break;
    case 'scroll': setTimeout(() => { const L = $('#list'); L.scrollTop = Math.max(0, L.scrollHeight - L.clientHeight - 160); }, 50); break;
    case 'emoji': $('#emopan').classList.add('on'); break;
    case 'tiers': [10000, 50000].forEach((a) => push({ kind: 'donate', user: USERS[2], amount: a, type: a === 10000 ? '룰렛후원' : '텍스트후원', text: '오늘 방송 미쳤다 후원 받아라~' })); break;
    case 'slow': S.slow = true; S.role = 'donator'; S.lockUntil = Date.now() + 2000; break;
  }
  renderInput();
  clearTimeout(botT); botT = setTimeout(bot, 1500);
}
applyState(q.get('state') || 'live');
if (q.has('inspect')) F.classList.add('inspect');
post({ type: 'ready' });
})();
</script>
</body>
</html>
