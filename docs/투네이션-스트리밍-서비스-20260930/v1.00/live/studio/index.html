function series(r) {   // 5분 단위 가상 그래프 데이터
  const n = Math.max(8, Math.round(r.dur / 300)), out = [];
  let s2 = r.peak; const rr = () => (s2 = (s2 * 48271) % 2147483647) / 2147483647;
  let acc = 0, chat = 0, dn = 0, da = 0;
  for (let i = 0; i <= n; i++) {
    const x = i / n, shape = Math.sin(Math.PI * (0.04 + 0.92 * x)) ** 0.7;
    const v = Math.round(r.peak * shape * (0.82 + rr() * 0.18));
    acc += Math.round(v * 0.08); chat += Math.round(v * 0.04 * rr()); if (rr() < 0.5) { dn += 1; da += Math.round(1 + rr() * 9) * 1000; }
    out.push({ t: Math.round(r.dur * x), v: [v, Math.round(v * (0.55 + rr() * 0.1)), acc, chat, dn, da] });
  }
  return out;
}

});

/* ---------------- 이동 ---------------- */
function go(v) { S.view = v; if (v === 'analysis' && !S.rows.length && !S._q) { S._q = 1; setPeriod(30); query(); } render(); if (v === 'daily') renderDaily(); }
$$('#lnb .it').forEach((b) => b.addEventListener('click', () => go(b.dataset.go)));
$('#san-ok').addEventListener('click', () => { S.sanPopup = false; render(); });
$('#cs').addEventListener('click', () => toast('고객센터로 이동 (프로토타입)'));

/* ---------------- 미리보기 영상 + 5초 주기 갱신 ---------------- */
const cv = $('#video'), cx = cv.getContext('2d');
function frame(t) {
  if (S.mode === 'live') {
    const w = cv.width, h = cv.height, k = t / 1000;
    const g = cx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#c9d2d8'); g.addColorStop(0.45, '#9aa59a'); g.addColorStop(1, '#5a6450'); cx.fillStyle = g; cx.fillRect(0, 0, w, h);
    cx.fillStyle = '#7d8187'; cx.beginPath(); cx.moveTo(w * 0.05, h); cx.lineTo(w * 0.36, h * 0.28); cx.lineTo(w * 0.44, h * 0.28); cx.lineTo(w * 0.86, h); cx.fill();
    cx.fillStyle = '#e8d24a'; for (let i = 0; i < 6; i++) { const y = ((k * 30 + i * 22) % 132) - 10; const s = y / h; cx.fillRect(w * 0.4 - s * 30, h * 0.28 + y, 3 + s * 10, 4 + s * 6); }
    cx.fillStyle = '#3f6b32'; cx.fillRect(w * 0.72, h * 0.05, w * 0.28, h * 0.95); cx.fillStyle = '#6b4a35'; cx.fillRect(w * 0.88, 0, w * 0.05, h);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// 3번 방송 정보: 동시 시청자·비트레이트는 5초 주기 갱신 (네트워크 불안정 중에는 마지막 값 유지), 방송 시간은 1초마다
setInterval(() => { if (S.mode === 'live') { S.viewers = Math.max(0, Math.round(S.viewers * (1 + (Math.random() - 0.45) * 0.08))); S.bitrate = Math.round(5800 + Math.random() * 400); } }, 5000);
setInterval(renderStats, 1000);

/* ---------------- 기획서 연결 (부모 뷰어와 postMessage) ---------------- */
const post = (m) => { try { parent.postMessage(Object.assign({ d2p: true }, m), '*'); } catch (_) {} };
F.addEventListener('click', (e) => {
  const el = e.target.closest('[data-spec]'); if (!el) return;
  post({ type: 'spec', refs: el.dataset.spec.split(/\s+/), label: (el.querySelector('label') ? el.querySelector('label').textContent : el.textContent || '').trim().slice(0, 30) });
}, true);
F.addEventListener('mouseover', (e) => {
  if (!F.classList.contains('inspect')) return;
  const el = e.target.closest('[data-spec]'), chip = $('#chip');
  if (!el) { chip.style.display = 'none'; return; }
  const r = el.getBoundingClientRect(), fr = F.getBoundingClientRect();
  chip.textContent = el.dataset.spec.split(/\s+/).map((x) => x.replace(':', 'p ')).join(' · ');
  chip.style.display = 'block'; chip.style.left = (r.left - fr.left) + 'px'; chip.style.top = Math.max(0, r.top - fr.top - 14) + 'px';
});
addEventListener('message', (e) => {
  const m = e.data; if (!m || !m.d2p) return;
  if (m.type === 'focus') {
    const els = $$('[data-spec]').filter((x) => x.dataset.spec.split(/\s+/).includes(m.ref) && x.offsetParent !== null);
    els.forEach((x) => { x.classList.remove('spec-flash'); void x.offsetWidth; x.classList.add('spec-flash'); setTimeout(() => x.classList.remove('spec-flash'), 3200); });
    post({ type: 'focused', ref: m.ref, count: els.length });
  } else if (m.type === 'inspect') F.classList.toggle('inspect', !!m.on);
  else if (m.type === 'event') runEvent(m.name, m.value);
  else if (m.type === 'state') applyState(m.state);
  else if (m.type === 'changed') {
    $$('[data-chg]').forEach((x) => x.removeAttribute('data-chg'));
    const set = new Set(m.refs || []);
    $$('[data-spec]').forEach((x) => { if (x.dataset.spec.split(/\s+/).some((r) => set.has(r))) x.setAttribute('data-chg', m.base ? m.base + ' 대비 변경' : '변경'); });
  }
});
function startLive() { S.mode = 'live'; S.startAt = Date.now() - 71000; S.viewers = 812; S.quality = 'good'; S.fail = false; }
function runEvent(name) {
  switch (name) {
    case 'live': if (S.mode !== 'live' && S.mode !== 'net') startLive(); S.mode = 'live'; S.quality = 'good'; S.view = 'manage'; toast('방송이 시작됐어요 — 상태는 서버 푸시로 즉시 갱신'); break;
    case 'mid': if (S.mode === 'off' || S.mode === 'sanction') startLive(); S.mode = 'live'; S.quality = 'mid'; S.view = 'manage'; break;
    case 'net': if (S.mode === 'off' || S.mode === 'sanction') startLive(); S.mode = 'net'; S.view = 'manage'; break;
    case 'recover': if (S.mode === 'net') { S.mode = 'live'; S.quality = 'good'; toast('연결이 회복됐어요'); } break;
    case 'end': S.mode = 'off'; S.view = 'manage'; toast('방송이 종료됐어요'); break;
    case 'fail': S.fail = !S.fail; toast(S.fail ? '일부 항목 조회 실패 → "-" 표시' : '조회 정상'); break;
    case 'sanction': S.mode = 'sanction'; S.sanPopup = true; S.view = 'manage'; break;
    case 'nodata': S.view = 'analysis'; $('#d1').value = ymd(TODAY); $('#d2').value = ymd(TODAY); S.rows = []; S.page = 1; $$('.pb').forEach((b) => b.classList.remove('on')); renderAnalysis(); break;
  }
  render(); if (S.view === 'daily') renderDaily();
}

/* ---------------- 초기 상태 (?state=) ---------------- */
function applyState(st) {
  Object.assign(S, { view: 'manage', mode: 'off', quality: 'good', fail: false, sanPopup: true });
  switch (st) {
    case 'live': startLive(); break;
    case 'net': startLive(); S.mode = 'net'; break;
    case 'sanction': S.mode = 'sanction'; break;
    case 'settings': S.view = 'settings'; break;
    case 'analysis': S.view = 'analysis'; break;
    case 'daily': S.view = 'daily'; break;
  }
  resetForm(S.mode === 'live' || S.mode === 'net');
  setPeriod(30); S.rows = ALL.filter((r) => r.date >= $('#d1').value && r.date <= $('#d2').value); S.page = 1; S._q = 1; renderAnalysis();
  if (st === 'daily') { S.daily = S.rows.find((r) => r.title === LAST_TITLE) || S.rows[0]; $('#dd').value = S.daily.date; }
  render(); if (S.view === 'daily') renderDaily();
}
applyState(q.get('state') || 'off');
if (q.has('inspect')) F.classList.add('inspect');
post({ type: 'ready' });
})();
</script>
</body>
</html>
